[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docs-to-data-to-lora"
version = "0.2.0"
description = "Curated docs → SFT dataset → LoRA adapter pipeline"
requires-python = ">=3.12"
dependencies = [
    "elasticsearch>=8.11,<9.0",
    "httpx>=0.27",
    "openai>=1.30",
    "pydantic>=2.5",
    "tiktoken>=0.7",
    "transformers>=4.43,<5",
    "tqdm>=4.66",
    # TODO: install separately, not on PyPI as 'nemo-curator'
    # "nemo-curator>=0.5.0",
    "pyyaml>=6.0",
    "datasketch>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
