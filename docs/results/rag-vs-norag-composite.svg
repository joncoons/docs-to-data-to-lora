<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-labelledby="title desc">
<title id="title">Golden Evaluation: RAG Lift Over No-RAG</title>
<desc id="desc">Reduced Claude Sonnet 4.6 single-axis scores for LE r32 adapters and the 70B dense reference.</desc>
<style>
