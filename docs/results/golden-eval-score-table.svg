<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="640" viewBox="0 0 1360 640" role="img" aria-labelledby="title desc">
<title id="title">Golden Evaluation Score Table</title>
<desc id="desc">Reduced no-retrieval and retrieval-augmented scores; summary columns are followed by retrieval diagnostics.</desc>
<style>
.bg{fill:#f7f9fb}.title{font:700 24px Arial,sans-serif;fill:#16212d}.subtitle{font:400 13px Arial,sans-serif;fill:#526070}
