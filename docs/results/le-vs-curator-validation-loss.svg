<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="640" viewBox="0 0 1360 640" role="img" aria-labelledby="title desc">
  <title id="title">Curator vs Logical Entailment Validation Loss</title>
  <desc id="desc">Bar chart comparing logical entailment and Curator DiverseQA best validation loss for matched five-epoch Corpus A and Corpus B r16 and r32 LoRA adapters. Lower is better.</desc>
  <style>
    .title { font: 700 24px Arial, sans-serif; fill: #111827; }
    .subtitle { font: 14px Arial, sans-serif; fill: #4b5563; }
    .axis { font: 12px Arial, sans-serif; fill: #4b5563; }
    .xlabel { font: 700 14px Arial, sans-serif; fill: #111827; }
    .delta { font: 12px Arial, sans-serif; fill: #9a3412; }
    .barval { font: 12px Arial, sans-serif; fill: #111827; }
    .legend { font: 13px Arial, sans-serif; fill: #374151; }
    .note { font: 12px Arial, sans-serif; fill: #6b7280; }
  </style>
  <rect width="1360" height="640" fill="#ffffff"/>
  <text x="110" y="48" class="title">Curator vs LE validation loss</text>
  <text x="110" y="74" class="subtitle">Same corpora, Llama 3.1 8B LoRA. Lower is better. Both paths use matched five-epoch validation-best checkpoints.</text>
  <rect x="930" y="38" width="16" height="16" fill="#2f855a" rx="2"/><text x="954" y="51" class="legend">Logical entailment</text>
  <rect x="1100" y="38" width="16" height="16" fill="#c2410c" rx="2"/><text x="1124" y="51" class="legend">Curator</text>
  <line x1="110" y1="480.0" x2="1250" y2="480.0" stroke="#d8dee9" stroke-width="1"/><text x="96" y="485.0" text-anchor="end" class="axis">0.0</text>
  <line x1="110" y1="390.0" x2="1250" y2="390.0" stroke="#d8dee9" stroke-width="1"/><text x="96" y="395.0" text-anchor="end" class="axis">0.4</text>
  <line x1="110" y1="300.0" x2="1250" y2="300.0" stroke="#d8dee9" stroke-width="1"/><text x="96" y="305.0" text-anchor="end" class="axis">0.8</text>
  <line x1="110" y1="210.0" x2="1250" y2="210.0" stroke="#d8dee9" stroke-width="1"/><text x="96" y="215.0" text-anchor="end" class="axis">1.2</text>
  <line x1="110" y1="120.0" x2="1250" y2="120.0" stroke="#d8dee9" stroke-width="1"/><text x="96" y="125.0" text-anchor="end" class="axis">1.6</text>
  <line x1="110" y1="120" x2="110" y2="480" stroke="#111827" stroke-width="1.5"/>
  <line x1="110" y1="480" x2="1250" y2="480" stroke="#111827" stroke-width="1.5"/>
  <text x="38" y="300" transform="rotate(-90 38 300)" text-anchor="middle" class="axis">Validation loss</text>
  <rect x="189.0" y="185.0" width="48" height="295.0" fill="#2f855a" rx="3"/><text x="213.0" y="177.0" text-anchor="middle" class="barval">1.311</text>
  <rect x="253.0" y="159.6" width="48" height="320.4" fill="#c2410c" rx="3"/><text x="277.0" y="151.6" text-anchor="middle" class="barval">1.424</text>
  <text x="245" y="522" text-anchor="middle" class="xlabel">Corpus A r16</text><text x="245" y="548" text-anchor="middle" class="delta">Curator +8.6%</text>
  <rect x="479.0" y="194.5" width="48" height="285.5" fill="#2f855a" rx="3"/><text x="503.0" y="186.5" text-anchor="middle" class="barval">1.269</text>
  <rect x="543.0" y="160.1" width="48" height="319.9" fill="#c2410c" rx="3"/><text x="567.0" y="152.1" text-anchor="middle" class="barval">1.422</text>
  <text x="535" y="522" text-anchor="middle" class="xlabel">Corpus A r32</text><text x="535" y="548" text-anchor="middle" class="delta">Curator +12.1%</text>
  <rect x="769.0" y="257.0" width="48" height="223.0" fill="#2f855a" rx="3"/><text x="793.0" y="249.0" text-anchor="middle" class="barval">0.991</text>
  <rect x="833.0" y="152.2" width="48" height="327.8" fill="#c2410c" rx="3"/><text x="857.0" y="144.2" text-anchor="middle" class="barval">1.457</text>
  <text x="825" y="522" text-anchor="middle" class="xlabel">Corpus B r16</text><text x="825" y="548" text-anchor="middle" class="delta">Curator +47.0%</text>
  <rect x="1059.0" y="266.9" width="48" height="213.1" fill="#2f855a" rx="3"/><text x="1083.0" y="258.9" text-anchor="middle" class="barval">0.947</text>
  <rect x="1123.0" y="161.4" width="48" height="318.6" fill="#c2410c" rx="3"/><text x="1147.0" y="153.4" text-anchor="middle" class="barval">1.416</text>
  <text x="1115" y="522" text-anchor="middle" class="xlabel">Corpus B r32</text><text x="1115" y="548" text-anchor="middle" class="delta">Curator +49.6%</text>
  <text x="110" y="600" class="note">Both paths use matched five-epoch Customizer LoRA SFT runs; bars report retained best validation loss.</text>
</svg>
