<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Curator vs Logical Entailment Validation Loss</title>
  <desc id="desc">Bar chart comparing logical entailment two-epoch validation loss against Curator five-epoch best validation loss for NIM and NeMo Microservices r16 and r32 LoRA adapters. Lower is better.</desc>
  <style>
    .title { font: 700 24px Arial, sans-serif; fill: #111827; }
    .subtitle { font: 14px Arial, sans-serif; fill: #4b5563; }
    .axis { font: 12px Arial, sans-serif; fill: #4b5563; }
    .xlabel { font: 700 14px Arial, sans-serif; fill: #111827; }
    .delta { font: 12px Arial, sans-serif; fill: #9a3412; }
    .barval { font: 12px Arial, sans-serif; fill: #111827; }
    .legend { font: 13px Arial, sans-serif; fill: #374151; }
    .note { font: 12px Arial, sans-serif; fill: #6b7280; }
  </style>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="110" y="48" class="title">Curator vs LE validation loss</text>
  <text x="110" y="74" class="subtitle">Same corpora, Llama 3.1 8B LoRA. Lower is better. LE bars use retained 2-epoch loss; Curator bars use 5-epoch validation-best checkpoints.</text>
  <rect x="665" y="38" width="16" height="16" fill="#2f855a" rx="2"/><text x="689" y="51" class="legend">Logical entailment</text>
  <rect x="805" y="38" width="16" height="16" fill="#c2410c" rx="2"/><text x="829" y="51" class="legend">Curator</text>
  <line x1="110" y1="430.0" x2="870" y2="430.0" stroke="#d8dee9" stroke-width="1"/><text x="96" y="435.0" text-anchor="end" class="axis">0.0</text><line x1="110" y1="352.5" x2="870" y2="352.5" stroke="#d8dee9" stroke-width="1"/><text x="96" y="357.5" text-anchor="end" class="axis">0.4</text><line x1="110" y1="275.0" x2="870" y2="275.0" stroke="#d8dee9" stroke-width="1"/><text x="96" y="280.0" text-anchor="end" class="axis">0.8</text><line x1="110" y1="197.5" x2="870" y2="197.5" stroke="#d8dee9" stroke-width="1"/><text x="96" y="202.5" text-anchor="end" class="axis">1.2</text><line x1="110" y1="120.0" x2="870" y2="120.0" stroke="#d8dee9" stroke-width="1"/><text x="96" y="125.0" text-anchor="end" class="axis">1.6</text>
  <line x1="110" y1="120" x2="110" y2="430" stroke="#111827" stroke-width="1.5"/>
  <line x1="110" y1="430" x2="870" y2="430" stroke="#111827" stroke-width="1.5"/>
  <text x="38" y="282" transform="rotate(-90 38 282)" text-anchor="middle" class="axis">Validation loss</text>
  <rect x="150.0" y="176.0" width="36" height="254.0" fill="#2f855a" rx="3"/><text x="168.0" y="168.0" text-anchor="middle" class="barval">1.311</text><rect x="194.0" y="154.1" width="36" height="275.9" fill="#c2410c" rx="3"/><text x="212.0" y="146.1" text-anchor="middle" class="barval">1.424</text><rect x="340.0" y="184.1" width="36" height="245.9" fill="#2f855a" rx="3"/><text x="358.0" y="176.1" text-anchor="middle" class="barval">1.269</text><rect x="384.0" y="154.5" width="36" height="275.5" fill="#c2410c" rx="3"/><text x="402.0" y="146.5" text-anchor="middle" class="barval">1.422</text><rect x="530.0" y="238.0" width="36" height="192.0" fill="#2f855a" rx="3"/><text x="548.0" y="230.0" text-anchor="middle" class="barval">0.991</text><rect x="574.0" y="147.8" width="36" height="282.2" fill="#c2410c" rx="3"/><text x="592.0" y="139.8" text-anchor="middle" class="barval">1.457</text><rect x="720.0" y="246.5" width="36" height="183.5" fill="#2f855a" rx="3"/><text x="738.0" y="238.5" text-anchor="middle" class="barval">0.947</text><rect x="764.0" y="155.6" width="36" height="274.4" fill="#c2410c" rx="3"/><text x="782.0" y="147.6" text-anchor="middle" class="barval">1.416</text>
  <text x="182" y="466" text-anchor="middle" class="xlabel">NIM r16</text><text x="182" y="492" text-anchor="middle" class="delta">Curator +8.6%</text><text x="372" y="466" text-anchor="middle" class="xlabel">NIM r32</text><text x="372" y="492" text-anchor="middle" class="delta">Curator +12.1%</text><text x="562" y="466" text-anchor="middle" class="xlabel">NeMo r16</text><text x="562" y="492" text-anchor="middle" class="delta">Curator +47.0%</text><text x="752" y="466" text-anchor="middle" class="xlabel">NeMo r32</text><text x="752" y="492" text-anchor="middle" class="delta">Curator +49.6%</text>
  <text x="110" y="526" class="note">Caveat: strict LE five-epoch jobs completed, but retained artifacts/API no longer expose best validation loss.</text>
</svg>
