# Example configuration for the MLflow + NeMo orchestration template.
# Copy values into your deployment-specific config; do not commit secrets.

mlflow:
  tracking_uri: "http://mlflow:5000"
  experiment_name: "docs-to-data-to-lora"
  artifact_root: null

nemo:
  workspace: "default"
  project: "docs-to-data-to-lora"
  platform_base_url: "http://nemo-platform-api:8080"
  customizer_url: "http://nemo-platform-api:8080"
  data_designer_url: "http://nemo-platform-api:8080"
  evaluator_url: "http://nemo-platform-api:8080"
  inference_gateway_url: "http://nemo-platform-api:8080"
  entity_store_url: "http://nemo-platform-api:8080"
  data_store_url: "http://nemo-platform-api:8080"
  data_store_internal_hf_endpoint: "http://nemo-platform-api:8080/v1/hf"
  data_store_git_base: "http://nemo-data-store:3000"  # TIES/Data Store compatibility
  customizer_payload_format: "platform"
  model_entities_manifest: "/outputs/observability/platform-models/platform_model_entities_manifest.json"
  filesets_observability_dir: "/outputs/observability/platform-filesets"
  filesets_manifest: "/outputs/observability/platform-filesets/platform_filesets_manifest.json"

data_store_auth:
  # Prefer environment variables in implementation.
  username_env: "NEMO_DATA_STORE_USER"
  password_env: "NEMO_DATA_STORE_PASSWORD"

collections:
  nim_curated:
    corpus_short: "nim"
    stage2_dir: "/mnt/nvme2/peft/datasets/v2/nim_curated"
    train_dataset_name: "stage3-nim-curated"
    train_dataset_entity: "default/stage3-nim-curated"
    train_fileset_uri: "fileset://default/stage3-nim-curated"
    test_dataset_name: "stage3-nim-curated-test"
    test_fileset_uri: "fileset://default/stage3-nim-curated-test"
    context_test_fileset_uri: "fileset://default/stage3-nim-curated-context-test"
    evaluator_dataset_ref: "default/stage3-nim-curated-test"

  nemo_usvcs_curated:
    corpus_short: "nemo-usvcs"
    stage2_dir: "/mnt/nvme2/peft/datasets/v2/nemo_usvcs_curated"
    train_dataset_name: "stage3-nemo-usvcs-curated"
    train_dataset_entity: "default/stage3-nemo-usvcs-curated"
    train_fileset_uri: "fileset://default/stage3-nemo-usvcs-curated"
    test_dataset_name: "stage3-nemo-usvcs-curated-test"
    test_fileset_uri: "fileset://default/stage3-nemo-usvcs-curated-test"
    context_test_fileset_uri: "fileset://default/stage3-nemo-usvcs-curated-context-test"
    evaluator_dataset_ref: "default/stage3-nemo-usvcs-curated-test"

base_models:
  meta/llama-3.2-1b-instruct:
    model_entity: "default/llama-3.2-1b-instruct"
    model_fileset: "default/llama-3.2-1b-instruct"
    hf_repo_id: "meta-llama/Llama-3.2-1B-Instruct"
    requires_hf_token: true
    customizer_template: "meta/llama-3.2-1b-instruct@v1.0.0+80GB"  # legacy rollback only
    allow_base_target: true

  meta/llama-3.2-3b-instruct:
    model_entity: "default/llama-3.2-3b-instruct"
    model_fileset: "default/llama-3.2-3b-instruct"
    hf_repo_id: "meta-llama/Llama-3.2-3B-Instruct"
    requires_hf_token: true
    customizer_template: "meta/llama-3.2-3b-instruct@v1.0.0+80GB"  # legacy rollback only
    allow_base_target: true

  meta/llama-3.1-8b-instruct:
    model_entity: "default/llama-3.1-8b-instruct"
    model_fileset: "default/llama-3.1-8b-instruct"
    hf_repo_id: "meta-llama/Meta-Llama-3.1-8B-Instruct"
    requires_hf_token: true
    customizer_template: "meta/llama-3.1-8b-instruct@v1.0.0+80GB"  # legacy rollback only
    allow_base_target: true

  nvidia/nemotron-3-nano-30b-a3b:
    model_entity: "default/nemotron-3-nano-30b-a3b"
    model_fileset: "default/nemotron-3-nano-30b-a3b"
    hf_repo_id: "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16"
    requires_hf_token: false
    customizer_template: "nvidia/nemotron-3-nano-30b-a3b@v1.0+96GB-singleGPU"  # legacy rollback only
    allow_base_target: true

training_defaults:
  epochs: 2
  batch_size: 16
  learning_rate: 0.0001
  warmup_steps: 30
  seed: 42
  optimizer: "adamw_with_cosine_annealing"
  sequence_packing_enabled: false
  ranks:
    - 16
    - 32

evaluation:
  register_targets: true
  register_configs: true
  run_singleaxis: true
  run_pairwise_lora: true
  run_pairwise_49b: true
  config_singleaxis: "default/stage3-singleaxis-rubric"
  config_pairwise: "default/stage3-pairwise-tournament"

promotion:
  enabled: false
  min_accuracy_mean: 4.0
  min_faithfulness_mean: 4.0
  min_win_rate_vs_base: 0.55
  require_eval_complete: true

polling:
  customizer_interval_s: 30
  customizer_timeout_s: 14400
  evaluator_interval_s: 30
  evaluator_timeout_s: 21600
