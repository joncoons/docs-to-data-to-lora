---
apiVersion: batch/v1
kind: Job
metadata:
  name: curator-nim-curated
  namespace: nemo-peft
  labels:
    app.kubernetes.io/name: curator
    app.kubernetes.io/part-of: docs-to-data-to-lora
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: curator
        app.kubernetes.io/part-of: docs-to-data-to-lora
    spec:
      restartPolicy: Never
      containers:
        - name: curator-handoff
          image: <registry>/docs-to-data-to-lora/curator:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CURATOR_MODE
              value: prepare
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow:5000"
            - name: MLFLOW_EXPERIMENT_NAME
              value: "docs-to-data-to-lora"
            - name: PIPELINE_RUN_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          args:
            - --dataset-dir
            - /datasets/nim_curated
            - --collection
            - nim_curated
            - --mode
            - $(CURATOR_MODE)
            - --config-file
            - /workspace/configs/curator/sft-dedup-quality.yaml
            - --observability-dir
            - /observability/curator/nim_curated
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 32Gi
          volumeMounts:
            - name: dataset-artifacts
              mountPath: /datasets
            - name: observability-output
              mountPath: /observability
      volumes:
        - name: dataset-artifacts
          persistentVolumeClaim:
            claimName: stage3-datasets
        - name: observability-output
          persistentVolumeClaim:
            claimName: pipeline-observability
