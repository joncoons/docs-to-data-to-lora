---
apiVersion: batch/v1
kind: Job
metadata:
  name: register-stage3-evaluator-entities
  namespace: nemo-peft
  labels:
    app.kubernetes.io/name: evaluator-registration
    app.kubernetes.io/part-of: docs-to-data-to-lora
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evaluator-registration
        app.kubernetes.io/part-of: docs-to-data-to-lora
    spec:
      restartPolicy: Never
      containers:
        - name: evaluator-registration
          image: <registry>/docs-to-data-to-lora/evaluator-registration:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nemo-platform-service-plane
          env:
            - name: EVALUATOR_URL
              valueFrom:
                configMapKeyRef:
                  name: nemo-platform-service-plane
                  key: NMP_EVALUATOR_URL
            - name: NIM_PROXY_URL
              valueFrom:
                configMapKeyRef:
                  name: nemo-platform-service-plane
                  key: NMP_INFERENCE_GATEWAY_URL
            - name: EVALUATOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nemo-evaluator-api
                  key: EVALUATOR_API_KEY
                  optional: true
          args:
            - --all
            - --log-path
            - /inputs/training_session.log
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: training-session-log
              mountPath: /inputs
              readOnly: true
      volumes:
        - name: training-session-log
          configMap:
            name: stage3-training-session-log
