---
apiVersion: batch/v1
kind: Job
metadata:
  name: ties-merge-nemo-usvcs-nano-r16
  namespace: nemo-peft
  labels:
    app.kubernetes.io/name: ties-merge
    app.kubernetes.io/part-of: docs-to-data-to-lora
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ties-merge
        app.kubernetes.io/part-of: docs-to-data-to-lora
    spec:
      restartPolicy: Never
      containers:
        - name: ties-merge
          image: <registry>/docs-to-data-to-lora/ties-merge:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATA_STORE_GIT_BASE
              value: "http://nemo-data-store:3000"
            - name: DATA_STORE_USER
              valueFrom:
                secretKeyRef:
                  name: nemo-data-store-git
                  key: DATA_STORE_USER
            - name: DATA_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nemo-data-store-git
                  key: DATA_STORE_PASSWORD
          args:
            - --adapters
            - default/lora-nemo-usvcs-nemotron-nano-30b-r16-shard-a@cust-REPLACE_A
            - default/lora-nemo-usvcs-nemotron-nano-30b-r16-shard-b@cust-REPLACE_B
            - --out
            - /outputs/lora-nemo-usvcs-nemotron-nano-30b-r16
            - --trim-ratio
            - "0.2"
          resources:
            requests:
              cpu: "4"
              memory: 24Gi
            limits:
              cpu: "8"
              memory: 32Gi
          volumeMounts:
            - name: adapter-output
              mountPath: /outputs
      volumes:
        - name: adapter-output
          persistentVolumeClaim:
            claimName: peft-checkpoints
