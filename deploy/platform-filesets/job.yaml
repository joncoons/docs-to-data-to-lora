---
apiVersion: batch/v1
kind: Job
metadata:
  name: upload-stage3-platform-filesets
  namespace: nemo-peft
  labels:
    app.kubernetes.io/name: platform-filesets
    app.kubernetes.io/part-of: docs-to-data-to-lora
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-filesets
        app.kubernetes.io/part-of: docs-to-data-to-lora
    spec:
      restartPolicy: Never
      containers:
        - name: platform-filesets
          image: <registry>/docs-to-data-to-lora/platform-filesets:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nemo-platform-service-plane
          env:
            - name: OBSERVABILITY_DIR
              value: /outputs/observability/platform-filesets
            - name: PIPELINE_RUN_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          args:
            - --base-dir
            - /datasets
            - --collections
            - nim_curated
            - nemo_usvcs_curated
            - --include-train
            - --include-test
            - --include-context-test
            - --observability-dir
            - /outputs/observability/platform-filesets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: dataset-artifacts
              mountPath: /datasets
              readOnly: true
            - name: fileset-output
              mountPath: /outputs
      volumes:
        - name: dataset-artifacts
          persistentVolumeClaim:
            claimName: stage3-datasets
        - name: fileset-output
          persistentVolumeClaim:
            claimName: pipeline-observability
