---
apiVersion: batch/v1
kind: Job
metadata:
  name: register-stage3-datasets
  namespace: nemo-peft
  labels:
    app.kubernetes.io/name: dataset-registration
    app.kubernetes.io/part-of: docs-to-data-to-lora
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dataset-registration
        app.kubernetes.io/part-of: docs-to-data-to-lora
    spec:
      restartPolicy: Never
      containers:
        - name: dataset-registration
          image: <registry>/docs-to-data-to-lora/dataset-registration:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nemo-platform-service-plane
          env:
            - name: ENTITY_STORE_URL
              valueFrom:
                configMapKeyRef:
                  name: nemo-platform-service-plane
                  key: NMP_ENTITY_STORE_URL
            - name: DATA_STORE_URL
              valueFrom:
                configMapKeyRef:
                  name: nemo-platform-service-plane
                  key: NMP_DATASTORE_URL
            - name: DATA_STORE_GIT_BASE
              valueFrom:
                configMapKeyRef:
                  name: nemo-platform-service-plane
                  key: NMP_DATASTORE_GIT_BASE
            - name: DATA_STORE_HF_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: nemo-platform-service-plane
                  key: NMP_DATASTORE_HF_ENDPOINT
            - name: DATA_STORE_USER
              valueFrom:
                secretKeyRef:
                  name: nemo-data-store-git
                  key: DATA_STORE_USER
            - name: DATA_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nemo-data-store-git
                  key: DATA_STORE_PASSWORD
            - name: OBSERVABILITY_DIR
              value: /outputs/observability/dataset-registration
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow:5000"
            - name: MLFLOW_EXPERIMENT_NAME
              value: "docs-to-data-to-lora"
            - name: PIPELINE_RUN_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          args:
            - --base-dir
            - /datasets
            - --collections
            - nim_curated
            - nemo_usvcs_curated
            - --include-train
            - --include-test
            - --include-context-test
            - --observability-dir
            - /outputs/observability/dataset-registration
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: dataset-artifacts
              mountPath: /datasets
              readOnly: true
            - name: registration-output
              mountPath: /outputs
      volumes:
        - name: dataset-artifacts
          persistentVolumeClaim:
            claimName: stage3-datasets
        - name: registration-output
          persistentVolumeClaim:
            claimName: pipeline-observability
