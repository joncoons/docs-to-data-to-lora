# Values overlay for the docs-to-data-to-lora NeMo Platform showcase.
#
# Target chart, confirmed from NVIDIA's 26.3.1 NeMo Platform install guide:
#   ngc registry chart pull --org nvidian '0857255566152269/external/nemo-platform:2.0.1'
#
# Keep image tags owned by the chart unless the cluster mirror requires explicit
# overrides. Repository-owned workload images are pinned in their own deploy/*
# directories.

existingSecret: ngc-api
existingImagePullSecret: nvcrimagepullsecret

rbac:
  volcanoEnabled: true
  k8sNimOperatorEnabled: true

k8s-nim-operator:
  enabled: true

postgresql:
  enabled: true
  persistence:
    storageClass: ""
    size: 20Gi

externalDatabase:
  host: localhost
  port: 5432
  user: nemo
  database: nemoplatform
  existingSecret: ""
  existingSecretPasswordKey: ""

platformConfig:
  jobs:
    executor_defaults:
      kubernetes_job:
        storage:
          pvc_name: stage3-datasets
      volcano_job:
        storage:
          pvc_name: stage3-datasets

core:
  storage:
    storageClass: ""
    accessModes:
      - ReadWriteMany
    size: 200Gi
