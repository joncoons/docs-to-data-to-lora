---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nemo-platform-service-plane
  namespace: nemo-peft
  labels:
    app.kubernetes.io/name: nemo-platform-service-plane
    app.kubernetes.io/part-of: docs-to-data-to-lora
data:
  # Core/job API for the currently deployed nemo-platform Helm release.
  # Confirm with `kubectl get svc -n nemo-peft` after chart upgrades; this
  # cluster exposes service-specific APIs instead of a `nemo-platform-api`
  # aggregate service.
  NMP_BASE_URL: "http://nemo-core-api:8000"
  NMP_WORKSPACE: "default"

  # Service-specific aliases allow existing scripts to run while their payloads
  # are migrated to first-class NeMo Platform SDK calls.
  NMP_CUSTOMIZER_URL: "http://nemo-customizer:8000"
  NMP_DATA_DESIGNER_URL: "http://nemo-data-designer:8000"
  NMP_EVALUATOR_URL: "http://nemo-evaluator:7331"
  # Temporary evaluator target compatibility until native NIM Proxy is verified.
  NMP_INFERENCE_GATEWAY_URL: "http://rag-oai-proxy.runai-rag.svc.cluster.local:8080"
  NMP_ENTITY_STORE_URL: "http://nemo-entity-store:8000"
  NMP_DATASTORE_URL: "http://nemo-data-store:3000"
  NMP_DATASTORE_HF_ENDPOINT: "http://nemo-data-store:3000/v1/hf"

  # Temporary compatibility path for code that still clones or pushes
  # HF-style Git repos directly. Platform FileSets are now available for
  # Customizer dataset handoff; TIES clone mode still uses this endpoint.
  NMP_DATASTORE_GIT_BASE: "http://nemo-data-store:3000"
