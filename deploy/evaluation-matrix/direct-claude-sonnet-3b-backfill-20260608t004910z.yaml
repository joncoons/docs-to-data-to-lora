---
apiVersion: batch/v1
kind: Job
metadata:
  name: claude-sonnet-3b-backfill-20260608t004910z
  namespace: runai-rag
  labels:
    app.kubernetes.io/name: direct-claude-sonnet-backfill
    app.kubernetes.io/component: 3b-claude-phase2-phase3
    app.kubernetes.io/part-of: docs-to-data-to-lora
    eval-run-id: "claude-sonnet-3b-backfill-20260608t004910z"
spec:
  suspend: true
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: direct-claude-sonnet-backfill
        app.kubernetes.io/component: 3b-claude-phase2-phase3
        app.kubernetes.io/part-of: docs-to-data-to-lora
        eval-run-id: "claude-sonnet-3b-backfill-20260608t004910z"
    spec:
      restartPolicy: Never
      containers:
        - name: backfill
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              pip install --no-cache-dir -q httpx
              echo "Starting Phase 2 Claude Sonnet 3B base comparison backfill"
              python /scripts/pairwise/run_direct_kimi_pairwise.py \
                --pair 3b-base /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.2-3b/base/base/20260529t142723z/responses.jsonl 3b-r16 /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.2-3b/lora-nim/r16/20260529t142723z/responses.jsonl \
                --pair 3b-base /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.2-3b/base/base/20260529t142723z/responses.jsonl 3b-r32 /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.2-3b/lora-nim/r32/20260529t142723z/responses.jsonl \
                --pair 3b-base /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.2-3b/base/base/20260529t142723z/responses.jsonl 3b-r16 /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.2-3b/lora-nemo-usvcs/r16/20260529t142723z/responses.jsonl \
                --pair 3b-base /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.2-3b/base/base/20260529t142723z/responses.jsonl 3b-r32 /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.2-3b/lora-nemo-usvcs/r32/20260529t142723z/responses.jsonl \
                --eval-run-id "$PHASE2_EVAL_RUN_ID" \
                --output-root "$PAIRWISE_OUTPUT_ROOT" \
                --judge-api-url "$JUDGE_API_URL" \
                --judge-model "$EVALUATOR_JUDGE_MODEL" \
                --judge-api-key-env KIMI_KEY \
                --judge-max-tokens 8192 \
                --judge-max-attempts 5 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 120 \
                --retry-jitter-s 2 \
                --concurrency 4 \
                --resume \
                --position-swap \
                --log-every 25

              echo "Starting Phase 3 Claude Sonnet 49B vs 3B base backfill"
              python /scripts/pairwise/run_direct_kimi_pairwise.py \
                --pair 49b-base /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.3-nemotron-super-49b-v1.5/base/base/20260529t142723z-plus-retry/responses.jsonl 3b-base /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.2-3b/base/base/20260529t142723z/responses.jsonl \
                --pair 49b-base /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.3-nemotron-super-49b-v1.5/base/base/20260529t220127z/responses.jsonl 3b-base /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.2-3b/base/base/20260529t142723z/responses.jsonl \
                --eval-run-id "$PHASE3_EVAL_RUN_ID" \
                --output-root "$PAIRWISE_OUTPUT_ROOT" \
                --judge-api-url "$JUDGE_API_URL" \
                --judge-model "$EVALUATOR_JUDGE_MODEL" \
                --judge-api-key-env KIMI_KEY \
                --judge-max-tokens 8192 \
                --judge-max-attempts 5 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 120 \
                --retry-jitter-s 2 \
                --concurrency 4 \
                --resume \
                --position-swap \
                --log-every 25
          env:
            - name: PAIRWISE_OUTPUT_ROOT
              value: /mnt/nvme2/peft/evals/pairwise-claude-sonnet
            - name: PHASE2_EVAL_RUN_ID
              value: 3b-claude-sonnet-phase2-base-backfill-20260608t004910z
            - name: PHASE3_EVAL_RUN_ID
              value: phase3-49b-vs-3b-base-claude-sonnet-backfill-20260608t004910z
            - name: JUDGE_API_URL
              value: https://inference-api.nvidia.com/v1/chat/completions
            - name: EVALUATOR_JUDGE_MODEL
              value: azure/anthropic/claude-sonnet-4-6
            - name: KIMI_KEY
              valueFrom:
                secretKeyRef:
                  name: kimi-judge-api
                  key: KIMI_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: pairwise-script
              mountPath: /scripts/pairwise
              readOnly: true
            - name: nvme2
              mountPath: /mnt/nvme2
      volumes:
        - name: pairwise-script
          configMap:
            name: direct-kimi-pairwise-script
            defaultMode: 0555
        - name: nvme2
          persistentVolumeClaim:
            claimName: nvme2-pvc
---
apiVersion: batch/v1
kind: Job
metadata:
  name: claude-sonnet-3b-backfill-gate-20260608t004910z
  namespace: runai-rag
  labels:
    app.kubernetes.io/name: direct-claude-sonnet-release-gate
    app.kubernetes.io/component: 3b-claude-after-8b-release
    app.kubernetes.io/part-of: docs-to-data-to-lora
    eval-run-id: "claude-sonnet-3b-backfill-20260608t004910z"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: direct-claude-sonnet-release-gate
        app.kubernetes.io/component: 3b-claude-after-8b-release
        app.kubernetes.io/part-of: docs-to-data-to-lora
        eval-run-id: "claude-sonnet-3b-backfill-20260608t004910z"
    spec:
      serviceAccountName: direct-kimi-pairwise-release-gate
      restartPolicy: Never
      containers:
        - name: release-gate
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              python - <<'PYCODE'
              import json
              import os
              import ssl
              import time
              import urllib.request

              namespace = os.environ["POD_NAMESPACE"]
              host = os.environ["KUBERNETES_SERVICE_HOST"]
              port = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
              base_url = f"https://{host}:{port}/apis/batch/v1/namespaces/{namespace}/jobs"
              token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
              ca_path = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              token = open(token_path, encoding="utf-8").read().strip()
              context = ssl.create_default_context(cafile=ca_path)
              wait_job = os.environ["WAIT_JOB"]
              release_job = os.environ["RELEASE_JOB"]
              poll_interval_s = int(os.environ.get("POLL_INTERVAL_S", "60"))
              max_wait_s = int(os.environ.get("MAX_WAIT_S", "172800"))

              def call(method, job_name, body=None):
                  data = None
                  headers = {"Authorization": f"Bearer {token}"}
                  if body is not None:
                      data = json.dumps(body).encode("utf-8")
                      headers["Content-Type"] = "application/merge-patch+json"
                  request = urllib.request.Request(
                      f"{base_url}/{job_name}",
                      data=data,
                      headers=headers,
                      method=method,
                  )
                  with urllib.request.urlopen(request, context=context, timeout=30) as response:
                      return json.loads(response.read().decode("utf-8"))

              started = time.monotonic()
              while True:
                  job = call("GET", wait_job)
                  status = job.get("status", {})
                  if int(status.get("succeeded", 0) or 0) > 0:
                      break
                  if int(status.get("failed", 0) or 0) > 0:
                      raise SystemExit(f"Refusing to release {release_job} because {wait_job} failed")
                  if time.monotonic() - started > max_wait_s:
                      raise SystemExit(f"Timed out waiting for {wait_job}")
                  print(f"Waiting for {wait_job} before releasing {release_job}", flush=True)
                  time.sleep(poll_interval_s)

              job = call("GET", release_job)
              if job.get("spec", {}).get("suspend") is False:
                  print(f"{release_job} is already unsuspended", flush=True)
              else:
                  call("PATCH", release_job, {"spec": {"suspend": False}})
                  print(f"Unsuspended {release_job}", flush=True)
              PYCODE
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WAIT_JOB
              value: claude-sonnet-8b-backfill-20260608t004910z
            - name: RELEASE_JOB
              value: claude-sonnet-3b-backfill-20260608t004910z
            - name: POLL_INTERVAL_S
              value: "60"
            - name: MAX_WAIT_S
              value: "172800"
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
