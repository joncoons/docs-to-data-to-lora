---
apiVersion: batch/v1
kind: Job
metadata:
  name: claude-sonnet-3b-dd5x-20260608t005645z
  namespace: runai-rag
  labels:
    app.kubernetes.io/name: direct-claude-sonnet-eval
    app.kubernetes.io/component: llama-3.2-3b-dd5x
    app.kubernetes.io/part-of: docs-to-data-to-lora
    eval-run-id: "3b-dd5x-claude-sonnet-20260608t005645z"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: direct-claude-sonnet-eval
        app.kubernetes.io/component: llama-3.2-3b-dd5x
        app.kubernetes.io/part-of: docs-to-data-to-lora
        eval-run-id: "3b-dd5x-claude-sonnet-20260608t005645z"
    spec:
      restartPolicy: Never
      containers:
        - name: direct-eval
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              pip install --no-cache-dir -q httpx

              export NIM_BASE=/mnt/nvme2/peft/evals/completions/nim_curated/llama-3.2-3b/base/base/20260608t005645z/responses.jsonl
              export NIM_R16=/mnt/nvme2/peft/evals/completions/nim_curated/llama-3.2-3b/lora-nim-dd5x/r16/20260608t005645z/responses.jsonl
              export NIM_R32=/mnt/nvme2/peft/evals/completions/nim_curated/llama-3.2-3b/lora-nim-dd5x/r32/20260608t005645z/responses.jsonl
              export NEMO_BASE=/mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.2-3b/base/base/20260608t005645z/responses.jsonl
              export NEMO_R16=/mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.2-3b/lora-nemo-usvcs-dd5x/r16/20260608t005645z/responses.jsonl
              export NEMO_R32=/mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.2-3b/lora-nemo-usvcs-dd5x/r32/20260608t005645z/responses.jsonl
              export NIM_49B=/mnt/nvme2/peft/evals/completions/nim_curated/llama-3.3-nemotron-super-49b-v1.5/base/base/20260529t142723z-plus-retry/responses.jsonl
              export NEMO_49B=/mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.3-nemotron-super-49b-v1.5/base/base/20260529t220127z/responses.jsonl

              python - <<'PYCODE'
              import json
              import os
              import time
              from pathlib import Path

              expected = [
                  Path(os.environ["NIM_BASE"]),
                  Path(os.environ["NIM_R16"]),
                  Path(os.environ["NIM_R32"]),
                  Path(os.environ["NEMO_BASE"]),
                  Path(os.environ["NEMO_R16"]),
                  Path(os.environ["NEMO_R32"]),
              ]
              deadline = time.monotonic() + int(os.environ.get("COMPLETIONS_WAIT_S", "43200"))
              while True:
                  missing = []
                  bad = []
                  for responses in expected:
                      summary = responses.parent / "token_summary.json"
                      if not responses.exists() or not summary.exists():
                          missing.append(str(responses))
                          continue
                      payload = json.loads(summary.read_text(encoding="utf-8"))
                      failed = int(payload.get("rows_failed") or 0)
                      completed = int(payload.get("rows_completed") or 0)
                      if failed:
                          bad.append(f"{responses}: rows_failed={failed}")
                      if completed <= 0:
                          bad.append(f"{responses}: rows_completed={completed}")
                  if bad:
                      raise SystemExit("Completion collection finished with unresolved failures:\n" + "\n".join(bad))
                  if not missing:
                      print("All 3B completion files are ready.", flush=True)
                      break
                  if time.monotonic() > deadline:
                      raise SystemExit("Timed out waiting for completion files:\n" + "\n".join(missing))
                  print(f"Waiting for {len(missing)} completion files...", flush=True)
                  time.sleep(60)
              PYCODE

              echo "Starting Phase 1 Claude Sonnet single-axis for 3B dd5x"
              python /scripts/singleaxis/run_direct_kimi_singleaxis.py \
                --responses "$NIM_BASE" \
                --responses "$NIM_R16" \
                --responses "$NIM_R32" \
                --responses "$NEMO_BASE" \
                --responses "$NEMO_R16" \
                --responses "$NEMO_R32" \
                --eval-run-id "3b-dd5x-claude-sonnet-singleaxis-20260608t005645z" \
                --output-root "$SINGLEAXIS_OUTPUT_ROOT" \
                --judge-api-url "$JUDGE_API_URL" \
                --judge-model "$EVALUATOR_JUDGE_MODEL" \
                --judge-api-key-env KIMI_KEY \
                --judge-max-tokens 8192 \
                --judge-max-attempts 5 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 120 \
                --retry-jitter-s 2 \
                --concurrency 4 \
                --resume \
                --log-every 25

              echo "Starting Phase 2 Claude Sonnet pairwise for 3B dd5x"
              python /scripts/pairwise/run_direct_kimi_pairwise.py \
                --pair 3b-base "$NIM_BASE" 3b-nim-dd5x-r16 "$NIM_R16" \
                --pair 3b-base "$NIM_BASE" 3b-nim-dd5x-r32 "$NIM_R32" \
                --pair 3b-nim-dd5x-r16 "$NIM_R16" 3b-nim-dd5x-r32 "$NIM_R32" \
                --pair 3b-base "$NEMO_BASE" 3b-nemo-usvcs-dd5x-r16 "$NEMO_R16" \
                --pair 3b-base "$NEMO_BASE" 3b-nemo-usvcs-dd5x-r32 "$NEMO_R32" \
                --pair 3b-nemo-usvcs-dd5x-r16 "$NEMO_R16" 3b-nemo-usvcs-dd5x-r32 "$NEMO_R32" \
                --eval-run-id "3b-dd5x-claude-sonnet-phase2-20260608t005645z" \
                --output-root "$PAIRWISE_OUTPUT_ROOT" \
                --judge-api-url "$JUDGE_API_URL" \
                --judge-model "$EVALUATOR_JUDGE_MODEL" \
                --judge-api-key-env KIMI_KEY \
                --judge-max-tokens 8192 \
                --judge-max-attempts 5 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 120 \
                --retry-jitter-s 2 \
                --concurrency 4 \
                --resume \
                --position-swap \
                --log-every 25

              echo "Starting Phase 3 Claude Sonnet pairwise: 49B vs 3B dd5x"
              python /scripts/pairwise/run_direct_kimi_pairwise.py \
                --pair 49b "$NIM_49B" 3b-base "$NIM_BASE" \
                --pair 49b "$NIM_49B" 3b-nim-dd5x-r16 "$NIM_R16" \
                --pair 49b "$NIM_49B" 3b-nim-dd5x-r32 "$NIM_R32" \
                --pair 49b "$NEMO_49B" 3b-base "$NEMO_BASE" \
                --pair 49b "$NEMO_49B" 3b-nemo-usvcs-dd5x-r16 "$NEMO_R16" \
                --pair 49b "$NEMO_49B" 3b-nemo-usvcs-dd5x-r32 "$NEMO_R32" \
                --eval-run-id "phase3-49b-vs-3b-dd5x-claude-sonnet-20260608t005645z" \
                --output-root "$PAIRWISE_OUTPUT_ROOT" \
                --judge-api-url "$JUDGE_API_URL" \
                --judge-model "$EVALUATOR_JUDGE_MODEL" \
                --judge-api-key-env KIMI_KEY \
                --judge-max-tokens 8192 \
                --judge-max-attempts 5 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 120 \
                --retry-jitter-s 2 \
                --concurrency 4 \
                --resume \
                --position-swap \
                --log-every 25
          env:
            - name: SINGLEAXIS_OUTPUT_ROOT
              value: /mnt/nvme2/peft/evals/singleaxis-claude-sonnet
            - name: PAIRWISE_OUTPUT_ROOT
              value: /mnt/nvme2/peft/evals/pairwise-claude-sonnet
            - name: COMPLETIONS_WAIT_S
              value: "43200"
            - name: JUDGE_API_URL
              value: https://inference-api.nvidia.com/v1/chat/completions
            - name: EVALUATOR_JUDGE_MODEL
              value: azure/anthropic/claude-sonnet-4-6
            - name: KIMI_KEY
              valueFrom:
                secretKeyRef:
                  name: kimi-judge-api
                  key: KIMI_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: singleaxis-script
              mountPath: /scripts/singleaxis
              readOnly: true
            - name: pairwise-script
              mountPath: /scripts/pairwise
              readOnly: true
            - name: nvme2
              mountPath: /mnt/nvme2
      volumes:
        - name: singleaxis-script
          configMap:
            name: direct-kimi-singleaxis-script
            defaultMode: 0555
        - name: pairwise-script
          configMap:
            name: direct-kimi-pairwise-script
            defaultMode: 0555
        - name: nvme2
          persistentVolumeClaim:
            claimName: nvme2-pvc
