---
apiVersion: batch/v1
kind: Job
metadata:
  name: direct-kimi-singleaxis-nano-retrain-20260530t193808z
  namespace: runai-rag
  labels:
    app.kubernetes.io/name: direct-kimi-singleaxis
    app.kubernetes.io/component: nemotron-nano-30b
    app.kubernetes.io/part-of: docs-to-data-to-lora
    model-family: nemotron-nano
    adapter: lora-nemo-usvcs-retrain
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: direct-kimi-singleaxis
        app.kubernetes.io/component: nemotron-nano-30b
        app.kubernetes.io/part-of: docs-to-data-to-lora
        model-family: nemotron-nano
        adapter: lora-nemo-usvcs-retrain
    spec:
      restartPolicy: Never
      containers:
        - name: direct-kimi-singleaxis
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              pip install --no-cache-dir -q httpx
              python /scripts/run_direct_kimi_singleaxis.py \
                --responses <EVAL_ROOT>/completions/nim_curated/nemotron-nano-30b/lora-nemo-usvcs/r16/20260530t153804z/responses.jsonl \
                --responses <EVAL_ROOT>/completions/nemo_usvcs_curated/nemotron-nano-30b/lora-nemo-usvcs/r16/20260530t153804z/responses.jsonl \
                --eval-run-id "$EVAL_RUN_ID" \
                --judge-api-url "$JUDGE_API_URL" \
                --judge-model "$EVALUATOR_JUDGE_MODEL" \
                --judge-api-key-env KIMI_KEY \
                --judge-max-tokens 8192 \
                --judge-max-attempts 5 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 120 \
                --retry-jitter-s 2 \
                --concurrency 1 \
                --resume \
                --log-every 25
          env:
            - name: EVAL_RUN_ID
              value: "20260530T193808Z"
            - name: SINGLEAXIS_OUTPUT_ROOT
              value: <EVAL_ROOT>/singleaxis-kimi
            - name: COMPLETIONS_OUTPUT_ROOT
              value: <EVAL_ROOT>/completions
            - name: JUDGE_API_URL
              value: "https://llm.example.com/v1/chat/completions"
            - name: EVALUATOR_JUDGE_MODEL
              value: "nvidia/moonshotai/kimi-k2.6"
            - name: KIMI_KEY
              valueFrom:
                secretKeyRef:
                  name: kimi-judge-api
                  key: KIMI_KEY
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: singleaxis-script
              mountPath: /scripts
              readOnly: true
            - name: nvme2
              mountPath: /workspace/artifacts
      volumes:
        - name: singleaxis-script
          configMap:
            name: direct-kimi-singleaxis-script
            defaultMode: 0555
        - name: nvme2
          persistentVolumeClaim:
            claimName: nvme2-pvc
