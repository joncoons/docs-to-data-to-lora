apiVersion: v1
kind: ServiceAccount
metadata:
  name: direct-kimi-pairwise-release-gate
  namespace: runai-rag
  labels:
    app.kubernetes.io/name: direct-kimi-pairwise-release-gate
    app.kubernetes.io/part-of: docs-to-data-to-lora
    eval-run-id: "20260530t195331z"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: direct-kimi-pairwise-release-gate
  namespace: runai-rag
  labels:
    app.kubernetes.io/name: direct-kimi-pairwise-release-gate
    app.kubernetes.io/part-of: docs-to-data-to-lora
    eval-run-id: "20260530t195331z"
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: direct-kimi-pairwise-release-gate
  namespace: runai-rag
  labels:
    app.kubernetes.io/name: direct-kimi-pairwise-release-gate
    app.kubernetes.io/part-of: docs-to-data-to-lora
    eval-run-id: "20260530t195331z"
subjects:
  - kind: ServiceAccount
    name: direct-kimi-pairwise-release-gate
    namespace: runai-rag
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: direct-kimi-pairwise-release-gate
---
apiVersion: batch/v1
kind: Job
metadata:
  name: direct-kimi-pairwise-release-gate-20260530t195331z
  namespace: runai-rag
  labels:
    app.kubernetes.io/name: direct-kimi-pairwise-release-gate
    app.kubernetes.io/part-of: docs-to-data-to-lora
    eval-run-id: "20260530t195331z"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: direct-kimi-pairwise-release-gate
        app.kubernetes.io/part-of: docs-to-data-to-lora
        eval-run-id: "20260530t195331z"
    spec:
      serviceAccountName: direct-kimi-pairwise-release-gate
      restartPolicy: Never
      containers:
        - name: release-gate
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              python - <<'PY'
              import json
              import os
              import ssl
              import time
              import urllib.request

              namespace = os.environ["POD_NAMESPACE"]
              host = os.environ["KUBERNETES_SERVICE_HOST"]
              port = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
              base_url = f"https://{host}:{port}/apis/batch/v1/namespaces/{namespace}/jobs"
              token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
              ca_path = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              token = open(token_path, encoding="utf-8").read().strip()
              context = ssl.create_default_context(cafile=ca_path)

              wait_jobs = [item.strip() for item in os.environ["WAIT_JOBS"].split(",") if item.strip()]
              release_jobs = [item.strip() for item in os.environ["RELEASE_JOBS"].split(",") if item.strip()]
              poll_interval_s = int(os.environ.get("POLL_INTERVAL_S", "60"))
              max_wait_s = int(os.environ.get("MAX_WAIT_S", "172800"))

              def call(method, job_name, body=None):
                  data = None
                  headers = {"Authorization": f"Bearer {token}"}
                  if body is not None:
                      data = json.dumps(body).encode("utf-8")
                      headers["Content-Type"] = "application/merge-patch+json"
                  request = urllib.request.Request(
                      f"{base_url}/{job_name}",
                      data=data,
                      headers=headers,
                      method=method,
                  )
                  with urllib.request.urlopen(request, context=context, timeout=30) as response:
                      return json.loads(response.read().decode("utf-8"))

              started = time.monotonic()
              while True:
                  complete = []
                  pending = []
                  failed = []
                  for job_name in wait_jobs:
                      job = call("GET", job_name)
                      status = job.get("status", {})
                      if int(status.get("succeeded", 0) or 0) > 0:
                          complete.append(job_name)
                      elif int(status.get("failed", 0) or 0) > 0:
                          failed.append(job_name)
                      else:
                          pending.append(job_name)

                  if failed:
                      raise SystemExit(f"Refusing to release pairwise jobs because dependencies failed: {failed}")
                  if not pending:
                      break
                  if time.monotonic() - started > max_wait_s:
                      raise SystemExit(f"Timed out waiting for dependencies: {pending}")

                  print(f"Waiting for single-axis dependencies. complete={complete} pending={pending}", flush=True)
                  time.sleep(poll_interval_s)

              for job_name in release_jobs:
                  job = call("GET", job_name)
                  if job.get("spec", {}).get("suspend") is False:
                      print(f"{job_name} is already unsuspended", flush=True)
                      continue
                  call("PATCH", job_name, {"spec": {"suspend": False}})
                  print(f"Unsuspended {job_name}", flush=True)
              PY
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WAIT_JOBS
              value: direct-kimi-singleaxis-dense-1b-20260530t195331z,direct-kimi-singleaxis-dense-3b-20260530t195331z,direct-kimi-singleaxis-dense-8b-20260530t195331z
            - name: RELEASE_JOBS
              value: direct-kimi-pairwise-stage1-nim-20260530t195331z,direct-kimi-pairwise-stage1-nemo-20260530t195331z
            - name: POLL_INTERVAL_S
              value: "60"
            - name: MAX_WAIT_S
              value: "172800"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
