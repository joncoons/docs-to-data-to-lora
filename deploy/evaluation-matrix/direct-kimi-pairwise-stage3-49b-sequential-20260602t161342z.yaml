apiVersion: batch/v1
kind: Job
metadata:
  name: direct-kimi-pw-s3-49b-nim-gate-20260602t161342z
  namespace: runai-rag
  labels:
    app.kubernetes.io/name: direct-kimi-pairwise-release-gate
    app.kubernetes.io/component: stage3-49b-nim-release
    app.kubernetes.io/part-of: docs-to-data-to-lora
    eval-run-id: "20260602t161342z"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: direct-kimi-pairwise-release-gate
        app.kubernetes.io/component: stage3-49b-nim-release
        app.kubernetes.io/part-of: docs-to-data-to-lora
        eval-run-id: "20260602t161342z"
    spec:
      serviceAccountName: direct-kimi-pairwise-release-gate
      restartPolicy: Never
      containers:
        - name: release-gate
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              python - <<'PYCODE'
              import json
              import os
              import ssl
              import time
              import urllib.request

              namespace = os.environ["POD_NAMESPACE"]
              host = os.environ["KUBERNETES_SERVICE_HOST"]
              port = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
              base_url = f"https://{host}:{port}/apis/batch/v1/namespaces/{namespace}/jobs"
              token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
              ca_path = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              token = open(token_path, encoding="utf-8").read().strip()
              context = ssl.create_default_context(cafile=ca_path)
              wait_jobs = [item.strip() for item in os.environ["WAIT_JOBS"].split(",") if item.strip()]
              release_job = os.environ["RELEASE_JOB"]
              poll_interval_s = int(os.environ.get("POLL_INTERVAL_S", "60"))
              max_wait_s = int(os.environ.get("MAX_WAIT_S", "172800"))

              def call(method, job_name, body=None):
                  data = None
                  headers = {"Authorization": f"Bearer {token}"}
                  if body is not None:
                      data = json.dumps(body).encode("utf-8")
                      headers["Content-Type"] = "application/merge-patch+json"
                  request = urllib.request.Request(
                      f"{base_url}/{job_name}",
                      data=data,
                      headers=headers,
                      method=method,
                  )
                  with urllib.request.urlopen(request, context=context, timeout=30) as response:
                      return json.loads(response.read().decode("utf-8"))

              started = time.monotonic()
              while True:
                  complete = []
                  pending = []
                  failed = []
                  for job_name in wait_jobs:
                      job = call("GET", job_name)
                      status = job.get("status", {})
                      if int(status.get("succeeded", 0) or 0) > 0:
                          complete.append(job_name)
                      elif int(status.get("failed", 0) or 0) > 0:
                          failed.append(job_name)
                      else:
                          pending.append(job_name)
                  if failed:
                      raise SystemExit(f"Refusing to release {release_job} because dependencies failed: {failed}")
                  if not pending:
                      break
                  if time.monotonic() - started > max_wait_s:
                      raise SystemExit(f"Timed out waiting for dependencies: {pending}")
                  print(f"Waiting before releasing {release_job}. complete={complete} pending={pending}", flush=True)
                  time.sleep(poll_interval_s)

              job = call("GET", release_job)
              if job.get("spec", {}).get("suspend") is False:
                  print(f"{release_job} is already unsuspended", flush=True)
              else:
                  call("PATCH", release_job, {"spec": {"suspend": False}})
                  print(f"Unsuspended {release_job}", flush=True)
              PYCODE
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WAIT_JOBS
              value: direct-kimi-pairwise-stage2-nim-20260602t161342z,direct-kimi-pairwise-stage2-nemo-20260602t161342z,direct-kimi-pairwise-stage2-nano-20260602t161342z
            - name: RELEASE_JOB
              value: direct-kimi-pairwise-stage3-49b-nim-20260602t161342z
            - name: POLL_INTERVAL_S
              value: "60"
            - name: MAX_WAIT_S
              value: "172800"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

