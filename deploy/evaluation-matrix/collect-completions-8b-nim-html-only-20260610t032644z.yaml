---
apiVersion: batch/v1
kind: Job
metadata:
  name: collect-8b-nim-html-only-20260610t032644z
  namespace: runai-rag
  labels:
    app.kubernetes.io/name: completion-collector
    app.kubernetes.io/component: llama-3.1-8b-html-only
    app.kubernetes.io/part-of: docs-to-data-to-lora
    run-id: "20260610t032644z"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: completion-collector
        app.kubernetes.io/component: llama-3.1-8b-html-only
        app.kubernetes.io/part-of: docs-to-data-to-lora
        run-id: "20260610t032644z"
    spec:
      restartPolicy: Never
      containers:
        - name: completion-collector
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              pip install --no-cache-dir -q httpx
              python /scripts/collect_completions.py \
                --dataset <DATASET_ROOT>/nim_curated_html_only/test_set_with_context.jsonl \
                --dataset-slug nim_curated_html_only \
                --target-api-url "$TARGET_API_URL" \
                --model meta/llama-3.1-8b-instruct \
                --model lora-nim-html-only-e5-llama-3.1-8b-r16 \
                --model lora-nim-html-only-e5-llama-3.1-8b-r32 \
                --run-id "20260610t032644z" \
                --max-tokens 8192 \
                --timeout-s 900 \
                --concurrency 8 \
                --resume \
                --retry-failed \
                --max-attempts 3 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 120 \
                --log-every 25
          env:
            - name: TARGET_API_URL
              value: "http://nim-llm-8b-bw-lora.runai-rag:8000"
            - name: COMPLETIONS_OUTPUT_ROOT
              value: <EVAL_ROOT>/completions
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: collector-script
              mountPath: /scripts
              readOnly: true
            - name: nvme2
              mountPath: /workspace/artifacts
      volumes:
        - name: collector-script
          configMap:
            name: completion-collector-script
            defaultMode: 0555
        - name: nvme2
          persistentVolumeClaim:
            claimName: nvme2-pvc
