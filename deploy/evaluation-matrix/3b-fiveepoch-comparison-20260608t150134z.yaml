---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: three-b-fiveepoch-eval-gate
  namespace: runai-rag
  labels:
    app.kubernetes.io/name: three-b-fiveepoch-eval-gate
    app.kubernetes.io/part-of: docs-to-data-to-lora
