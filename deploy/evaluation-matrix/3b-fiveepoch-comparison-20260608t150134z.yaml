  name: three-b-fiveepoch-eval-gate
  namespace: runai-rag
  labels:
    app.kubernetes.io/name: three-b-fiveepoch-eval-gate
    app.kubernetes.io/part-of: docs-to-data-to-lora
    eval-run-id: "20260608t150134z"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: three-b-fiveepoch-eval-gate
subjects:
  - kind: ServiceAccount
    name: three-b-fiveepoch-eval-gate
