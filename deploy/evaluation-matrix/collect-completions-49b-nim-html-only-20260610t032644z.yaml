---
apiVersion: batch/v1
kind: Job
metadata:
  name: collect-49b-nim-html-only-20260610t032644z
  namespace: runai-rag
  labels:
    app.kubernetes.io/name: completion-collector
    app.kubernetes.io/component: nemotron-super-49b-html-only
    app.kubernetes.io/part-of: docs-to-data-to-lora
    run-id: "20260610t032644z"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: completion-collector
        app.kubernetes.io/component: nemotron-super-49b-html-only
        app.kubernetes.io/part-of: docs-to-data-to-lora
        run-id: "20260610t032644z"
    spec:
      restartPolicy: Never
      containers:
        - name: completion-collector
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              pip install --no-cache-dir -q httpx
              python /scripts/collect_completions.py \
                --dataset /mnt/nvme2/peft/datasets/v2/nim_curated_html_only/test_set_with_context.jsonl \
                --dataset-slug nim_curated_html_only \
                --target-api-url "$TARGET_API_URL" \
                --model nvidia/llama-3.3-nemotron-super-49b-v1 \
                --run-id "20260610t032644z" \
                --max-tokens 8192 \
                --temperature 0.01 \
                --timeout-s 1200 \
                --concurrency 2 \
                --resume \
                --retry-failed \
                --max-attempts 4 \
                --retry-backoff-s 15 \
                --retry-backoff-max-s 120 \
                --log-every 25
          env:
            - name: TARGET_API_URL
              value: "http://nim-llm-49b-bw.runai-rag:8000"
            - name: COMPLETIONS_OUTPUT_ROOT
              value: /mnt/nvme2/peft/evals/completions
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: collector-script
              mountPath: /scripts
              readOnly: true
            - name: nvme2
              mountPath: /mnt/nvme2
      volumes:
        - name: collector-script
          configMap:
            name: completion-collector-script
            defaultMode: 0555
        - name: nvme2
          persistentVolumeClaim:
            claimName: nvme2-pvc
