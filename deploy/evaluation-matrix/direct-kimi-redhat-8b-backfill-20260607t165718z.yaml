apiVersion: batch/v1
kind: Job
metadata:
  name: kimi-redhat-8b-backfill-20260607t165718z
  namespace: runai-rag
  labels:
    app.kubernetes.io/name: direct-kimi-redhat-backfill
    app.kubernetes.io/component: 8b-phase1-phase2-phase3
    app.kubernetes.io/part-of: docs-to-data-to-lora
    eval-run-id: "kimi-redhat-8b-backfill-20260607t165718z"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: direct-kimi-redhat-backfill
        app.kubernetes.io/component: 8b-phase1-phase2-phase3
        app.kubernetes.io/part-of: docs-to-data-to-lora
        eval-run-id: "kimi-redhat-8b-backfill-20260607t165718z"
    spec:
      restartPolicy: Never
      containers:
        - name: backfill
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              pip install --no-cache-dir -q httpx
              python - <<'PYCODE'
              import json
              import os
              import time
              import urllib.error
              import urllib.request

              endpoint = os.environ["JUDGE_API_URL"].rstrip("/")
              if endpoint.endswith("/chat/completions"):
                  chat_url = endpoint
              elif endpoint.endswith("/v1"):
                  chat_url = endpoint + "/chat/completions"
              else:
                  chat_url = endpoint + "/v1/chat/completions"
              key = os.environ["KIMI_KEY"]
              model = os.environ["EVALUATOR_JUDGE_MODEL"]
              poll_s = int(os.environ.get("SMOKE_POLL_S", "300"))
              max_wait_s = int(os.environ.get("SMOKE_MAX_WAIT_S", "86400"))
              started = time.monotonic()
              payload = json.dumps({
                  "model": model,
                  "messages": [{"role": "user", "content": "Return JSON only: {\"ok\": true}"}],
                  "temperature": 0,
                  "max_tokens": 32,
              }).encode("utf-8")
              headers = {
                  "Authorization": f"Bearer {key}",
                  "Content-Type": "application/json",
              }
              attempt = 0
              while True:
                  attempt += 1
                  request = urllib.request.Request(chat_url, data=payload, headers=headers, method="POST")
                  try:
                      with urllib.request.urlopen(request, timeout=180) as response:
                          body = json.loads(response.read().decode("utf-8"))
                      choices = body.get("choices") or []
                      if choices:
                          print(f"Kimi Red Hat smoke passed on attempt {attempt}", flush=True)
                          break
                      print(f"Kimi Red Hat smoke attempt {attempt} returned no choices", flush=True)
                  except urllib.error.HTTPError as exc:
                      print(f"Kimi Red Hat smoke attempt {attempt} failed: HTTP {exc.code}", flush=True)
                  except Exception as exc:
                      print(f"Kimi Red Hat smoke attempt {attempt} failed: {type(exc).__name__}", flush=True)
                  if time.monotonic() - started > max_wait_s:
                      raise SystemExit("Kimi Red Hat smoke timed out before scoring")
                  time.sleep(poll_s)
              PYCODE

              echo "Starting Phase 1 Kimi Red Hat augmented 8B single-axis"
              python /scripts/singleaxis/run_direct_kimi_singleaxis.py \
                --responses /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.1-8b/base/base/20260606t035159z/responses.jsonl \
                --responses /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.1-8b/lora-nim-dd5x/r16/20260606t035159z/responses.jsonl \
                --responses /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.1-8b/lora-nim-dd5x/r32/20260606t035159z/responses.jsonl \
                --responses /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.1-8b/base/base/20260606t035159z/responses.jsonl \
                --responses /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.1-8b/lora-nemo-usvcs-dd5x/r16/20260606t035159z/responses.jsonl \
                --responses /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.1-8b/lora-nemo-usvcs-dd5x/r32/20260606t035159z/responses.jsonl \
                --eval-run-id "8b-dd5x-kimi-redhat-singleaxis-20260607t165718z" \
                --output-root "$SINGLEAXIS_OUTPUT_ROOT" \
                --judge-api-url "$JUDGE_API_URL" \
                --judge-model "$EVALUATOR_JUDGE_MODEL" \
                --judge-api-key-env KIMI_KEY \
                --judge-max-tokens 8192 \
                --judge-max-attempts 5 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 120 \
                --retry-jitter-s 2 \
                --concurrency 2 \
                --resume \
                --log-every 25

              echo "Starting Phase 2 Kimi Red Hat 8B pairwise backfill"
              python /scripts/pairwise/run_direct_kimi_pairwise.py \
                --pair 8b-base /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.1-8b/base/base/20260530t000400z/responses.jsonl 8b-nim-r16 /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.1-8b/lora-nim/r16/20260530t000400z/responses.jsonl \
                --pair 8b-base /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.1-8b/base/base/20260530t000400z/responses.jsonl 8b-nim-r32 /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.1-8b/lora-nim/r32/20260530t000400z/responses.jsonl \
                --pair 8b-base /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.1-8b/base/base/20260606t035159z/responses.jsonl 8b-nim-dd5x-r16 /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.1-8b/lora-nim-dd5x/r16/20260606t035159z/responses.jsonl \
                --pair 8b-base /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.1-8b/base/base/20260606t035159z/responses.jsonl 8b-nim-dd5x-r32 /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.1-8b/lora-nim-dd5x/r32/20260606t035159z/responses.jsonl \
                --pair 8b-nim-dd5x-r16 /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.1-8b/lora-nim-dd5x/r16/20260606t035159z/responses.jsonl 8b-nim-dd5x-r32 /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.1-8b/lora-nim-dd5x/r32/20260606t035159z/responses.jsonl \
                --pair 8b-base /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.1-8b/base/base/20260530t000400z/responses.jsonl 8b-nemo-usvcs-r16 /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.1-8b/lora-nemo-usvcs/r16/20260530t000400z/responses.jsonl \
                --pair 8b-base /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.1-8b/base/base/20260530t000400z/responses.jsonl 8b-nemo-usvcs-r32 /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.1-8b/lora-nemo-usvcs/r32/20260530t000400z/responses.jsonl \
                --pair 8b-base /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.1-8b/base/base/20260606t035159z/responses.jsonl 8b-nemo-usvcs-dd5x-r16 /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.1-8b/lora-nemo-usvcs-dd5x/r16/20260606t035159z/responses.jsonl \
                --pair 8b-base /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.1-8b/base/base/20260606t035159z/responses.jsonl 8b-nemo-usvcs-dd5x-r32 /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.1-8b/lora-nemo-usvcs-dd5x/r32/20260606t035159z/responses.jsonl \
                --pair 8b-nemo-usvcs-dd5x-r16 /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.1-8b/lora-nemo-usvcs-dd5x/r16/20260606t035159z/responses.jsonl 8b-nemo-usvcs-dd5x-r32 /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.1-8b/lora-nemo-usvcs-dd5x/r32/20260606t035159z/responses.jsonl \
                --eval-run-id "8b-kimi-redhat-phase2-backfill-20260607t165718z" \
                --output-root "$PAIRWISE_OUTPUT_ROOT" \
                --judge-api-url "$JUDGE_API_URL" \
                --judge-model "$EVALUATOR_JUDGE_MODEL" \
                --judge-api-key-env KIMI_KEY \
                --judge-max-tokens 8192 \
                --judge-max-attempts 5 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 120 \
                --retry-jitter-s 2 \
                --concurrency 2 \
                --resume \
                --position-swap \
                --log-every 25

              echo "Starting Phase 3 Kimi Red Hat 49B vs 8B pairwise backfill"
              python /scripts/pairwise/run_direct_kimi_pairwise.py \
                --pair 49b-base /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.3-nemotron-super-49b-v1.5/base/base/20260529t142723z-plus-retry/responses.jsonl 8b-base /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.1-8b/base/base/20260530t000400z/responses.jsonl \
                --pair 49b-base /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.3-nemotron-super-49b-v1.5/base/base/20260529t142723z-plus-retry/responses.jsonl 8b-base-dd5x-run /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.1-8b/base/base/20260606t035159z/responses.jsonl \
                --pair 49b-base /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.3-nemotron-super-49b-v1.5/base/base/20260529t142723z-plus-retry/responses.jsonl 8b-nim-dd5x-r16 /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.1-8b/lora-nim-dd5x/r16/20260606t035159z/responses.jsonl \
                --pair 49b-base /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.3-nemotron-super-49b-v1.5/base/base/20260529t142723z-plus-retry/responses.jsonl 8b-nim-dd5x-r32 /mnt/nvme2/peft/evals/completions/nim_curated/llama-3.1-8b/lora-nim-dd5x/r32/20260606t035159z/responses.jsonl \
                --pair 49b-base /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.3-nemotron-super-49b-v1.5/base/base/20260529t220127z/responses.jsonl 8b-base /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.1-8b/base/base/20260530t000400z/responses.jsonl \
                --pair 49b-base /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.3-nemotron-super-49b-v1.5/base/base/20260529t220127z/responses.jsonl 8b-base-dd5x-run /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.1-8b/base/base/20260606t035159z/responses.jsonl \
                --pair 49b-base /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.3-nemotron-super-49b-v1.5/base/base/20260529t220127z/responses.jsonl 8b-nemo-usvcs-dd5x-r16 /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.1-8b/lora-nemo-usvcs-dd5x/r16/20260606t035159z/responses.jsonl \
                --pair 49b-base /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.3-nemotron-super-49b-v1.5/base/base/20260529t220127z/responses.jsonl 8b-nemo-usvcs-dd5x-r32 /mnt/nvme2/peft/evals/completions/nemo_usvcs_curated/llama-3.1-8b/lora-nemo-usvcs-dd5x/r32/20260606t035159z/responses.jsonl \
                --eval-run-id "phase3-49b-vs-8b-kimi-redhat-backfill-20260607t165718z" \
                --output-root "$PAIRWISE_OUTPUT_ROOT" \
                --judge-api-url "$JUDGE_API_URL" \
                --judge-model "$EVALUATOR_JUDGE_MODEL" \
                --judge-api-key-env KIMI_KEY \
                --judge-max-tokens 8192 \
                --judge-max-attempts 5 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 120 \
                --retry-jitter-s 2 \
                --concurrency 2 \
                --resume \
                --position-swap \
                --log-every 25
          env:
            - name: SINGLEAXIS_OUTPUT_ROOT
              value: /mnt/nvme2/peft/evals/singleaxis-kimi
            - name: PAIRWISE_OUTPUT_ROOT
              value: /mnt/nvme2/peft/evals/pairwise-kimi
            - name: JUDGE_API_URL
              value: https://maas.apps.ocp.cloud.rhai-tmm.dev/prelude-maas/kimi-k2-6/v1
            - name: EVALUATOR_JUDGE_MODEL
              value: kimi-k2-6
            - name: SMOKE_POLL_S
              value: "300"
            - name: SMOKE_MAX_WAIT_S
              value: "86400"
            - name: KIMI_KEY
              valueFrom:
                secretKeyRef:
                  name: kimi-redhat-judge-api
                  key: KIMI_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: singleaxis-script
              mountPath: /scripts/singleaxis
              readOnly: true
            - name: pairwise-script
              mountPath: /scripts/pairwise
              readOnly: true
            - name: nvme2
              mountPath: /mnt/nvme2
      volumes:
        - name: singleaxis-script
          configMap:
            name: direct-kimi-singleaxis-script
            defaultMode: 0555
        - name: pairwise-script
          configMap:
            name: direct-kimi-pairwise-script
            defaultMode: 0555
        - name: nvme2
          persistentVolumeClaim:
            claimName: nvme2-pvc
