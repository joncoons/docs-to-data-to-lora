---
apiVersion: batch/v1
kind: Job
metadata:
  name: claude-sonnet-3b-nim-dd5x-e5-20260608t061659z
  namespace: runai-rag
  labels:
    app.kubernetes.io/name: direct-claude-sonnet-eval
    app.kubernetes.io/component: llama-3.2-3b-nim-dd5x-e5
    app.kubernetes.io/part-of: docs-to-data-to-lora
    eval-run-id: "3b-nim-dd5x-e5-claude-sonnet-20260608t061659z"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: direct-claude-sonnet-eval
        app.kubernetes.io/component: llama-3.2-3b-nim-dd5x-e5
        app.kubernetes.io/part-of: docs-to-data-to-lora
        eval-run-id: "3b-nim-dd5x-e5-claude-sonnet-20260608t061659z"
    spec:
      restartPolicy: Never
      containers:
        - name: direct-eval
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              pip install --no-cache-dir -q httpx
              export NIM_BASE=<EVAL_ROOT>/completions/nim_curated/llama-3.2-3b/base/base/20260608t005645z/responses.jsonl
              export NIM_R16=<EVAL_ROOT>/completions/nim_curated/llama-3.2-3b/lora-nim-dd5x/r16/20260608t005645z/responses.jsonl
              export NIM_R32=<EVAL_ROOT>/completions/nim_curated/llama-3.2-3b/lora-nim-dd5x/r32/20260608t005645z/responses.jsonl
              export NIM_E5_R16=<EVAL_ROOT>/completions/nim_curated/llama-3.2-3b/lora-nim-dd5x-e5/r16/20260608t061659z/responses.jsonl
              export NIM_49B=<EVAL_ROOT>/completions/nim_curated/llama-3.3-nemotron-super-49b-v1.5/base/base/20260529t142723z-plus-retry/responses.jsonl
              python - <<'PYCODE'
              import json
              import os
              import time
              from pathlib import Path
              responses = Path(os.environ['NIM_E5_R16'])
              summary = responses.parent / 'token_summary.json'
              deadline = time.monotonic() + int(os.environ.get('COMPLETIONS_WAIT_S', '43200'))
              while True:
                  if responses.exists() and summary.exists():
                      payload = json.loads(summary.read_text(encoding='utf-8'))
                      failed = int(payload.get('rows_failed') or 0)
                      completed = int(payload.get('rows_completed') or 0)
                      if failed:
                          raise SystemExit(f'Completion collection has unresolved failures: rows_failed={failed}')
                      if completed >= 540:
                          print(f'5-epoch completion file ready: rows_completed={completed}', flush=True)
                          break
                  if time.monotonic() > deadline:
                      raise SystemExit(f'Timed out waiting for {responses}')
                  print('Waiting for 5-epoch completion file...', flush=True)
                  time.sleep(60)
              PYCODE
              echo "Starting single-axis Claude Sonnet eval for 3B NIM dd5x e5 r16"
              python /scripts/singleaxis/run_direct_kimi_singleaxis.py --responses "$NIM_E5_R16" --eval-run-id "3b-nim-dd5x-e5-claude-sonnet-singleaxis-20260608t061659z" --output-root "$SINGLEAXIS_OUTPUT_ROOT" --judge-api-url "$JUDGE_API_URL" --judge-model "$EVALUATOR_JUDGE_MODEL" --judge-api-key-env KIMI_KEY --judge-max-tokens 8192 --judge-max-attempts 5 --retry-backoff-s 5 --retry-backoff-max-s 120 --retry-jitter-s 2 --concurrency 4 --resume --log-every 25
              echo "Starting pairwise Claude Sonnet eval for 3B NIM dd5x e5 r16"
              python /scripts/pairwise/run_direct_kimi_pairwise.py --pair 3b-base "$NIM_BASE" 3b-nim-dd5x-e5-r16 "$NIM_E5_R16" --pair 3b-nim-dd5x-r16 "$NIM_R16" 3b-nim-dd5x-e5-r16 "$NIM_E5_R16" --pair 3b-nim-dd5x-r32 "$NIM_R32" 3b-nim-dd5x-e5-r16 "$NIM_E5_R16" --pair 49b "$NIM_49B" 3b-nim-dd5x-e5-r16 "$NIM_E5_R16" --eval-run-id "3b-nim-dd5x-e5-claude-sonnet-pairwise-20260608t061659z" --output-root "$PAIRWISE_OUTPUT_ROOT" --judge-api-url "$JUDGE_API_URL" --judge-model "$EVALUATOR_JUDGE_MODEL" --judge-api-key-env KIMI_KEY --judge-max-tokens 8192 --judge-max-attempts 5 --retry-backoff-s 5 --retry-backoff-max-s 120 --retry-jitter-s 2 --concurrency 4 --resume --position-swap --log-every 25
          env:
            - name: SINGLEAXIS_OUTPUT_ROOT
              value: <EVAL_ROOT>/singleaxis-claude-sonnet
            - name: PAIRWISE_OUTPUT_ROOT
              value: <EVAL_ROOT>/pairwise-claude-sonnet
            - name: COMPLETIONS_WAIT_S
              value: "43200"
            - name: JUDGE_API_URL
              value: https://llm.example.com/v1/chat/completions
            - name: EVALUATOR_JUDGE_MODEL
              value: azure/anthropic/claude-sonnet-4-6
            - name: KIMI_KEY
              valueFrom:
                secretKeyRef:
                  name: kimi-judge-api
                  key: KIMI_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: singleaxis-script
              mountPath: /scripts/singleaxis
              readOnly: true
            - name: pairwise-script
              mountPath: /scripts/pairwise
              readOnly: true
            - name: nvme2
              mountPath: /workspace/artifacts
      volumes:
        - name: singleaxis-script
          configMap:
            name: direct-kimi-singleaxis-script
            defaultMode: 0555
        - name: pairwise-script
          configMap:
            name: direct-kimi-pairwise-script
            defaultMode: 0555
        - name: nvme2
          persistentVolumeClaim:
            claimName: nvme2-pvc
