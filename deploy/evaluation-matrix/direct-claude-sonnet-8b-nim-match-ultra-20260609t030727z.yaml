apiVersion: batch/v1
kind: Job
metadata:
  name: claude-sonnet-8b-nim-match-ultra-20260609t030727z
  namespace: runai-rag
  labels:
    app.kubernetes.io/name: direct-claude-sonnet-eval
    app.kubernetes.io/component: 8b-nim-match-ultra
    app.kubernetes.io/part-of: docs-to-data-to-lora
    eval-run-id: "8b-nim-claude-sonnet-match-ultra-20260609t030727z"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: direct-claude-sonnet-eval
        app.kubernetes.io/component: 8b-nim-match-ultra
        app.kubernetes.io/part-of: docs-to-data-to-lora
        eval-run-id: "8b-nim-claude-sonnet-match-ultra-20260609t030727z"
    spec:
      restartPolicy: Never
      containers:
        - name: direct-eval
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              pip install --no-cache-dir -q httpx

              export NIM_BASE_NONAUG=/mnt/nvme2/peft/evals/completions/nim_curated/llama-3.1-8b/base/base/20260530t000400z/responses.jsonl
              export NIM_R16_NONAUG=/mnt/nvme2/peft/evals/completions/nim_curated/llama-3.1-8b/lora-nim/r16/20260530t000400z/responses.jsonl
              export NIM_R32_NONAUG=/mnt/nvme2/peft/evals/completions/nim_curated/llama-3.1-8b/lora-nim/r32/20260530t000400z/responses.jsonl
              export NIM_BASE_DD5X=/mnt/nvme2/peft/evals/completions/nim_curated/llama-3.1-8b/base/base/20260606t035159z/responses.jsonl
              export NIM_R16_DD5X=/mnt/nvme2/peft/evals/completions/nim_curated/llama-3.1-8b/lora-nim-dd5x/r16/20260606t035159z/responses.jsonl
              export NIM_R32_DD5X=/mnt/nvme2/peft/evals/completions/nim_curated/llama-3.1-8b/lora-nim-dd5x/r32/20260606t035159z/responses.jsonl
              export NIM_49B=/mnt/nvme2/peft/evals/completions/nim_curated/llama-3.3-nemotron-super-49b-v1.5/base/base/20260529t142723z-plus-retry/responses.jsonl

              python - <<'PYCODE'
              import os
              from pathlib import Path

              required = [
                  "NIM_BASE_NONAUG",
                  "NIM_R16_NONAUG",
                  "NIM_R32_NONAUG",
                  "NIM_BASE_DD5X",
                  "NIM_R16_DD5X",
                  "NIM_R32_DD5X",
                  "NIM_49B",
              ]
              missing = [os.environ[name] for name in required if not Path(os.environ[name]).is_file()]
              if missing:
                  raise SystemExit("Missing required completion files:\n" + "\n".join(missing))
              print("All required 8B NIM completion files are present.", flush=True)
              PYCODE

              echo "Starting Phase 1 Claude Sonnet single-axis for 8B NIM non-aug"
              python /scripts/singleaxis/run_direct_kimi_singleaxis.py \
                --responses "$NIM_BASE_NONAUG" \
                --responses "$NIM_R16_NONAUG" \
                --responses "$NIM_R32_NONAUG" \
                --eval-run-id "8b-nonaug-claude-sonnet-match-ultra-20260609t030727z" \
                --output-root "$SINGLEAXIS_OUTPUT_ROOT" \
                --judge-api-url "$JUDGE_API_URL" \
                --judge-model "$EVALUATOR_JUDGE_MODEL" \
                --judge-api-key-env KIMI_KEY \
                --judge-max-tokens 8192 \
                --judge-timeout-s 600 \
                --judge-max-attempts 7 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 120 \
                --retry-jitter-s 2 \
                --concurrency 4 \
                --resume \
                --log-every 25

              echo "Starting Phase 1 Claude Sonnet single-axis for 8B NIM dd5x"
              python /scripts/singleaxis/run_direct_kimi_singleaxis.py \
                --responses "$NIM_BASE_DD5X" \
                --responses "$NIM_R16_DD5X" \
                --responses "$NIM_R32_DD5X" \
                --eval-run-id "8b-dd5x-claude-sonnet-match-ultra-20260609t030727z" \
                --output-root "$SINGLEAXIS_OUTPUT_ROOT" \
                --judge-api-url "$JUDGE_API_URL" \
                --judge-model "$EVALUATOR_JUDGE_MODEL" \
                --judge-api-key-env KIMI_KEY \
                --judge-max-tokens 8192 \
                --judge-timeout-s 600 \
                --judge-max-attempts 7 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 120 \
                --retry-jitter-s 2 \
                --concurrency 4 \
                --resume \
                --log-every 25

              echo "Starting Phase 2 Claude Sonnet pairwise for 8B NIM"
              python /scripts/pairwise/run_direct_kimi_pairwise.py \
                --pair 8b-base "$NIM_BASE_NONAUG" 8b-nim-r16 "$NIM_R16_NONAUG" \
                --pair 8b-base "$NIM_BASE_NONAUG" 8b-nim-r32 "$NIM_R32_NONAUG" \
                --pair 8b-nim-r16 "$NIM_R16_NONAUG" 8b-nim-r32 "$NIM_R32_NONAUG" \
                --pair 8b-base-dd5x-run "$NIM_BASE_DD5X" 8b-nim-dd5x-r16 "$NIM_R16_DD5X" \
                --pair 8b-base-dd5x-run "$NIM_BASE_DD5X" 8b-nim-dd5x-r32 "$NIM_R32_DD5X" \
                --pair 8b-nim-dd5x-r16 "$NIM_R16_DD5X" 8b-nim-dd5x-r32 "$NIM_R32_DD5X" \
                --eval-run-id "8b-claude-sonnet-phase2-match-ultra-20260609t030727z" \
                --output-root "$PAIRWISE_OUTPUT_ROOT" \
                --judge-api-url "$JUDGE_API_URL" \
                --judge-model "$EVALUATOR_JUDGE_MODEL" \
                --judge-api-key-env KIMI_KEY \
                --judge-max-tokens 8192 \
                --judge-timeout-s 600 \
                --judge-max-attempts 7 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 120 \
                --retry-jitter-s 2 \
                --concurrency 4 \
                --resume \
                --position-swap \
                --log-every 25

              echo "Starting Phase 3 Claude Sonnet pairwise: 49B vs 8B NIM"
              python /scripts/pairwise/run_direct_kimi_pairwise.py \
                --pair 49b-base "$NIM_49B" 8b-base "$NIM_BASE_NONAUG" \
                --pair 49b-base "$NIM_49B" 8b-nim-r16 "$NIM_R16_NONAUG" \
                --pair 49b-base "$NIM_49B" 8b-nim-r32 "$NIM_R32_NONAUG" \
                --pair 49b-base "$NIM_49B" 8b-base-dd5x-run "$NIM_BASE_DD5X" \
                --pair 49b-base "$NIM_49B" 8b-nim-dd5x-r16 "$NIM_R16_DD5X" \
                --pair 49b-base "$NIM_49B" 8b-nim-dd5x-r32 "$NIM_R32_DD5X" \
                --eval-run-id "phase3-49b-vs-8b-claude-sonnet-match-ultra-20260609t030727z" \
                --output-root "$PAIRWISE_OUTPUT_ROOT" \
                --judge-api-url "$JUDGE_API_URL" \
                --judge-model "$EVALUATOR_JUDGE_MODEL" \
                --judge-api-key-env KIMI_KEY \
                --judge-max-tokens 8192 \
                --judge-timeout-s 600 \
                --judge-max-attempts 7 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 120 \
                --retry-jitter-s 2 \
                --concurrency 4 \
                --resume \
                --position-swap \
                --log-every 25
          env:
            - name: SINGLEAXIS_OUTPUT_ROOT
              value: /mnt/nvme2/peft/evals/singleaxis-claude-sonnet
            - name: PAIRWISE_OUTPUT_ROOT
              value: /mnt/nvme2/peft/evals/pairwise-claude-sonnet
            - name: JUDGE_API_URL
              value: https://inference-api.nvidia.com/v1/chat/completions
            - name: EVALUATOR_JUDGE_MODEL
              value: azure/anthropic/claude-sonnet-4-6
            - name: KIMI_KEY
              valueFrom:
                secretKeyRef:
                  name: kimi-judge-api
                  key: KIMI_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: singleaxis-script
              mountPath: /scripts/singleaxis
              readOnly: true
            - name: pairwise-script
              mountPath: /scripts/pairwise
              readOnly: true
            - name: nvme2
              mountPath: /mnt/nvme2
      volumes:
        - name: singleaxis-script
          configMap:
            name: direct-kimi-singleaxis-script
            defaultMode: 0555
        - name: pairwise-script
          configMap:
            name: direct-kimi-pairwise-script
            defaultMode: 0555
        - name: nvme2
          persistentVolumeClaim:
            claimName: nvme2-pvc
