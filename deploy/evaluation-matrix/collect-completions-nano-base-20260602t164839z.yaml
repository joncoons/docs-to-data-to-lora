---
apiVersion: batch/v1
kind: Job
metadata:
  name: collect-stage3-nano-base-20260602t164839z
  namespace: runai-rag
  labels:
    app.kubernetes.io/name: completion-collector
    app.kubernetes.io/component: nemotron-nano-30b-base
    app.kubernetes.io/part-of: docs-to-data-to-lora
    model-family: nemotron-nano
    adapter: base
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: completion-collector
        app.kubernetes.io/component: nemotron-nano-30b-base
        app.kubernetes.io/part-of: docs-to-data-to-lora
        model-family: nemotron-nano
        adapter: base
    spec:
      restartPolicy: Never
      containers:
        - name: completion-collector
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              pip install --no-cache-dir -q httpx
              python /scripts/collect_completions.py \
                --dataset /mnt/nvme2/peft/datasets/v2/nim_curated/test_set_with_context.jsonl \
                --dataset-slug nim_curated \
                --model nemotron-3-nano-30b-a3b \
                --run-id "$RUN_ID" \
                --max-tokens 8192 \
                --temperature 0.01 \
                --resume \
                --max-attempts 4 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 60 \
                --timeout-s 900 \
                --concurrency 8
              python /scripts/collect_completions.py \
                --dataset /mnt/nvme2/peft/datasets/v2/nemo_usvcs_curated/test_set_with_context.jsonl \
                --dataset-slug nemo_usvcs_curated \
                --model nemotron-3-nano-30b-a3b \
                --run-id "$RUN_ID" \
                --max-tokens 8192 \
                --temperature 0.01 \
                --resume \
                --max-attempts 4 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 60 \
                --timeout-s 900 \
                --concurrency 8
          env:
            - name: TARGET_API_URL
              value: "http://rag-oai-proxy.runai-rag:8080"
            - name: COMPLETIONS_OUTPUT_ROOT
              value: /mnt/nvme2/peft/evals/completions
            - name: RUN_ID
              value: "20260602T164839Z"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: collector-script
              mountPath: /scripts
              readOnly: true
            - name: nvme2
              mountPath: /mnt/nvme2
      volumes:
        - name: collector-script
          configMap:
            name: completion-collector-script
            defaultMode: 0555
        - name: nvme2
          persistentVolumeClaim:
            claimName: nvme2-pvc
