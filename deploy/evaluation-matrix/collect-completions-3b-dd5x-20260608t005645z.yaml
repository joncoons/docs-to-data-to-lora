---
apiVersion: batch/v1
kind: Job
metadata:
  name: collect-3b-dd5x-completions-20260608t005645z
  namespace: runai-rag
  labels:
    app.kubernetes.io/name: completion-collector
    app.kubernetes.io/component: llama-3.2-3b-dd5x
    app.kubernetes.io/part-of: docs-to-data-to-lora
    eval-run-id: "20260608t005645z"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: completion-collector
        app.kubernetes.io/component: llama-3.2-3b-dd5x
        app.kubernetes.io/part-of: docs-to-data-to-lora
        eval-run-id: "20260608t005645z"
    spec:
      restartPolicy: Never
      containers:
        - name: completion-collector
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              pip install --no-cache-dir -q httpx
              RUN_ID="${RUN_ID:-20260608t005645z}"

              python /scripts/collect_completions.py \
                --dataset <DATASET_ROOT>/nim_curated/test_set_with_context.jsonl \
                --dataset-slug nim_curated \
                --model llama-3.2-3b-instruct \
                --model lora-nim-dd5x-llama-3.2-3b-r16 \
                --model lora-nim-dd5x-llama-3.2-3b-r32 \
                --run-id "$RUN_ID" \
                --max-tokens 8192 \
                --concurrency 2 \
                --timeout-s 900 \
                --resume \
                --retry-failed \
                --max-attempts 3 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 120 \
                --log-every 25

              python /scripts/collect_completions.py \
                --dataset <DATASET_ROOT>/nemo_usvcs_curated/test_set_with_context.jsonl \
                --dataset-slug nemo_usvcs_curated \
                --model llama-3.2-3b-instruct \
                --model lora-nemo-usvcs-dd5x-llama-3.2-3b-r16 \
                --model lora-nemo-usvcs-dd5x-llama-3.2-3b-r32 \
                --run-id "$RUN_ID" \
                --max-tokens 8192 \
                --concurrency 2 \
                --timeout-s 900 \
                --resume \
                --retry-failed \
                --max-attempts 3 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 120 \
                --log-every 25
          env:
            - name: TARGET_API_URL
              value: "http://rag-oai-proxy.runai-rag:8080"
            - name: COMPLETIONS_OUTPUT_ROOT
              value: <EVAL_ROOT>/completions
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: collector-script
              mountPath: /scripts
              readOnly: true
            - name: nvme2
              mountPath: /workspace/artifacts
      volumes:
        - name: collector-script
          configMap:
            name: completion-collector-script
            defaultMode: 0555
        - name: nvme2
          persistentVolumeClaim:
            claimName: nvme2-pvc
