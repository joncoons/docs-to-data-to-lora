---
apiVersion: batch/v1
kind: Job
metadata:
  name: ultra-phase3-html-only-release-gate-20260610t032644z
  namespace: runai-rag
  labels:
    app.kubernetes.io/name: direct-nemotron-ultra-release-gate
    app.kubernetes.io/component: phase3-49b-8b-nim-html-only-release
    app.kubernetes.io/part-of: docs-to-data-to-lora
    eval-run-id: "phase3-49b-vs-8b-nim-html-only-nemotron-ultra-20260610t032644z"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: direct-nemotron-ultra-release-gate
        app.kubernetes.io/component: phase3-49b-8b-nim-html-only-release
        app.kubernetes.io/part-of: docs-to-data-to-lora
        eval-run-id: "phase3-49b-vs-8b-nim-html-only-nemotron-ultra-20260610t032644z"
    spec:
      serviceAccountName: direct-kimi-pairwise-release-gate
      restartPolicy: Never
      containers:
        - name: release-gate
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              python - <<'PYCODE'
              import json
              import os
              import ssl
              import time
              import urllib.request

              namespace = os.environ["POD_NAMESPACE"]
              host = os.environ["KUBERNETES_SERVICE_HOST"]
              port = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
              base_url = f"https://{host}:{port}/apis/batch/v1/namespaces/{namespace}/jobs"
              token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
              ca_path = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              token = open(token_path, encoding="utf-8").read().strip()
              context = ssl.create_default_context(cafile=ca_path)
              wait_jobs = [j.strip() for j in os.environ["WAIT_JOBS"].split(",") if j.strip()]
              release_job = os.environ["RELEASE_JOB"]
              poll_interval_s = int(os.environ.get("POLL_INTERVAL_S", "60"))
              max_wait_s = int(os.environ.get("MAX_WAIT_S", "86400"))

              def call(method, job_name, body=None):
                  data = None
                  headers = {"Authorization": f"Bearer {token}"}
                  if body is not None:
                      data = json.dumps(body).encode("utf-8")
                      headers["Content-Type"] = "application/merge-patch+json"
                  req = urllib.request.Request(
                      f"{base_url}/{job_name}",
                      data=data,
                      headers=headers,
                      method=method,
                  )
                  with urllib.request.urlopen(req, context=context, timeout=30) as resp:
                      return json.loads(resp.read().decode("utf-8"))

              def job_state(job_name):
                  status = call("GET", job_name).get("status", {})
                  if status.get("failed", 0):
                      return "failed"
                  if status.get("succeeded", 0):
                      return "complete"
                  return "running"

              deadline = time.time() + max_wait_s
              while time.time() < deadline:
                  states = {name: job_state(name) for name in wait_jobs}
                  print(json.dumps({"waiting_for": states}), flush=True)
                  failed = [name for name, state in states.items() if state == "failed"]
                  if failed:
                      raise SystemExit(f"Prerequisite job(s) failed: {failed}")
                  if all(state == "complete" for state in states.values()):
                      call("PATCH", release_job, {"spec": {"suspend": False}})
                      print(json.dumps({"released": release_job}), flush=True)
                      raise SystemExit(0)
                  time.sleep(poll_interval_s)
              raise SystemExit(f"Timed out waiting for {wait_jobs}")
              PYCODE
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WAIT_JOBS
              value: "collect-49b-nim-html-only-20260610t032644z,ultra-8b-nim-html-only-20260610t032644z"
            - name: RELEASE_JOB
              value: "ultra-phase3-49b-8b-html-only-20260610t032644z"
            - name: POLL_INTERVAL_S
              value: "60"
            - name: MAX_WAIT_S
              value: "86400"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
