---
apiVersion: batch/v1
kind: Job
metadata:
  name: claude-sonnet-3b-fiveepoch-repair-20260608t150134z
  namespace: runai-rag
  labels:
    app.kubernetes.io/name: direct-claude-sonnet-eval
    app.kubernetes.io/component: llama-3.2-3b-fiveepoch-pairwise-repair
    app.kubernetes.io/part-of: docs-to-data-to-lora
    eval-run-id: "3b-fiveepoch-claude-sonnet-pairwise-20260608t150134z"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: direct-claude-sonnet-eval
        app.kubernetes.io/component: llama-3.2-3b-fiveepoch-pairwise-repair
        app.kubernetes.io/part-of: docs-to-data-to-lora
        eval-run-id: "3b-fiveepoch-claude-sonnet-pairwise-20260608t150134z"
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: repair-eval
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              python -m pip install --no-cache-dir -q --target /tmp/pydeps httpx
              export PYTHONPATH="/tmp/pydeps:${PYTHONPATH:-}"
              echo "Starting targeted Claude Sonnet pairwise repair for 3B five-epoch matrix"
              python /scripts/pairwise/run_direct_kimi_pairwise.py                 --pair 3b-base <EVAL_ROOT>/completions/nim_curated/llama-3.2-3b/base/base/20260608t005645z/responses.jsonl 3b-nim-e5-r16 <EVAL_ROOT>/completions/nim_curated/llama-3.2-3b/lora-nim-e5/r16/20260608t150134z/responses.jsonl                 --pair 3b-base <EVAL_ROOT>/completions/nim_curated/llama-3.2-3b/base/base/20260608t005645z/responses.jsonl 3b-nim-e5-r32 <EVAL_ROOT>/completions/nim_curated/llama-3.2-3b/lora-nim-e5/r32/20260608t150134z/responses.jsonl                 --pair 3b-nim-dd5x-e5-r16 <EVAL_ROOT>/completions/nim_curated/llama-3.2-3b/lora-nim-dd5x-e5/r16/20260608t061659z/responses.jsonl 3b-nim-dd5x-e5-r32 <EVAL_ROOT>/completions/nim_curated/llama-3.2-3b/lora-nim-dd5x-e5/r32/20260608t150134z/responses.jsonl                 --pair 3b-nim-e5-r32 <EVAL_ROOT>/completions/nim_curated/llama-3.2-3b/lora-nim-e5/r32/20260608t150134z/responses.jsonl 3b-nim-dd5x-e5-r32 <EVAL_ROOT>/completions/nim_curated/llama-3.2-3b/lora-nim-dd5x-e5/r32/20260608t150134z/responses.jsonl                 --pair 49b <EVAL_ROOT>/completions/nim_curated/llama-3.3-nemotron-super-49b-v1.5/base/base/20260529t142723z-plus-retry/responses.jsonl 3b-nim-dd5x-e5-r32 <EVAL_ROOT>/completions/nim_curated/llama-3.2-3b/lora-nim-dd5x-e5/r32/20260608t150134z/responses.jsonl                 --eval-run-id "3b-fiveepoch-claude-sonnet-pairwise-20260608t150134z"                 --output-root "$PAIRWISE_OUTPUT_ROOT"                 --judge-api-url "$JUDGE_API_URL"                 --judge-model "$EVALUATOR_JUDGE_MODEL"                 --judge-api-key-env KIMI_KEY                 --judge-max-tokens 8192                 --judge-timeout-s 600                 --judge-max-attempts 7                 --retry-backoff-s 5                 --retry-backoff-max-s 120                 --retry-jitter-s 2                 --concurrency 2                 --resume                 --position-swap                 --log-every 1
          env:
            - name: PAIRWISE_OUTPUT_ROOT
              value: <EVAL_ROOT>/pairwise-claude-sonnet
            - name: JUDGE_API_URL
              value: https://llm.example.com/v1/chat/completions
            - name: EVALUATOR_JUDGE_MODEL
              value: azure/anthropic/claude-sonnet-4-6
            - name: KIMI_KEY
              valueFrom:
                secretKeyRef:
                  name: kimi-judge-api
                  key: KIMI_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: pairwise-script
              mountPath: /scripts/pairwise
              readOnly: true
            - name: nvme2
              mountPath: /workspace/artifacts
      volumes:
        - name: pairwise-script
          configMap:
            name: direct-kimi-pairwise-script
            defaultMode: 0555
        - name: nvme2
          persistentVolumeClaim:
            claimName: nvme2-pvc
