apiVersion: batch/v1
kind: Job
metadata:
  name: direct-kimi-pairwise-stage1-nim-20260530t195331z
  namespace: runai-rag
  labels:
    app.kubernetes.io/name: direct-kimi-pairwise
    app.kubernetes.io/component: stage1-nim
    app.kubernetes.io/part-of: docs-to-data-to-lora
    eval-run-id: "20260530t195331z"
spec:
  suspend: true
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: direct-kimi-pairwise
        app.kubernetes.io/component: stage1-nim
        app.kubernetes.io/part-of: docs-to-data-to-lora
        eval-run-id: "20260530t195331z"
    spec:
      restartPolicy: Never
      containers:
        - name: direct-kimi-pairwise
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              pip install --no-cache-dir -q httpx
              python /scripts/run_direct_kimi_pairwise.py \
                --pair 1b-base <EVAL_ROOT>/completions/nim_curated/llama-3.2-1b/base/base/20260529t142723z/responses.jsonl 1b-r16 <EVAL_ROOT>/completions/nim_curated/llama-3.2-1b/lora-nim/r16/20260529t142723z/responses.jsonl \
                --pair 1b-base <EVAL_ROOT>/completions/nim_curated/llama-3.2-1b/base/base/20260529t142723z/responses.jsonl 1b-r32 <EVAL_ROOT>/completions/nim_curated/llama-3.2-1b/lora-nim/r32/20260529t142723z/responses.jsonl \
                --pair 1b-base <EVAL_ROOT>/completions/nim_curated/llama-3.2-1b/base/base/20260529t142723z/responses.jsonl 1b-aug-r16 <EVAL_ROOT>/completions/nim_curated/llama-3.2-1b/lora-nim-dd-kimi/r16/20260530t005356z/responses.jsonl \
                --pair 1b-base <EVAL_ROOT>/completions/nim_curated/llama-3.2-1b/base/base/20260529t142723z/responses.jsonl 1b-aug-r32 <EVAL_ROOT>/completions/nim_curated/llama-3.2-1b/lora-nim-dd-kimi/r32/20260530t005356z/responses.jsonl \
                --pair 3b-base <EVAL_ROOT>/completions/nim_curated/llama-3.2-3b/base/base/20260529t142723z/responses.jsonl 3b-r16 <EVAL_ROOT>/completions/nim_curated/llama-3.2-3b/lora-nim/r16/20260529t142723z/responses.jsonl \
                --pair 3b-base <EVAL_ROOT>/completions/nim_curated/llama-3.2-3b/base/base/20260529t142723z/responses.jsonl 3b-r32 <EVAL_ROOT>/completions/nim_curated/llama-3.2-3b/lora-nim/r32/20260529t142723z/responses.jsonl \
                --pair 8b-base <EVAL_ROOT>/completions/nim_curated/llama-3.1-8b/base/base/20260530t000400z/responses.jsonl 8b-r16 <EVAL_ROOT>/completions/nim_curated/llama-3.1-8b/lora-nim/r16/20260530t000400z/responses.jsonl \
                --pair 8b-base <EVAL_ROOT>/completions/nim_curated/llama-3.1-8b/base/base/20260530t000400z/responses.jsonl 8b-r32 <EVAL_ROOT>/completions/nim_curated/llama-3.1-8b/lora-nim/r32/20260530t000400z/responses.jsonl \
                --eval-run-id "$EVAL_RUN_ID" \
                --output-root "$PAIRWISE_OUTPUT_ROOT" \
                --judge-api-url "$JUDGE_API_URL" \
                --judge-model "$EVALUATOR_JUDGE_MODEL" \
                --judge-api-key-env KIMI_KEY \
                --judge-max-tokens 8192 \
                --judge-max-attempts 5 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 120 \
                --retry-jitter-s 2 \
                --concurrency 2 \
                --resume \
                --position-swap \
                --log-every 25
          env:
            - name: EVAL_RUN_ID
              value: "20260530T195331Z"
            - name: PAIRWISE_OUTPUT_ROOT
              value: <EVAL_ROOT>/pairwise-kimi
            - name: JUDGE_API_URL
              value: https://llm.example.com/v1/chat/completions
            - name: EVALUATOR_JUDGE_MODEL
              value: nvidia/moonshotai/kimi-k2.6
            - name: KIMI_KEY
              valueFrom:
                secretKeyRef:
                  name: kimi-judge-api
                  key: KIMI_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: pairwise-script
              mountPath: /scripts
              readOnly: true
            - name: nvme2
              mountPath: /workspace/artifacts
      volumes:
        - name: pairwise-script
          configMap:
            name: direct-kimi-pairwise-script
            defaultMode: 0555
        - name: nvme2
          persistentVolumeClaim:
            claimName: nvme2-pvc
