---
apiVersion: batch/v1
kind: Job
metadata:
  name: collect-stage3-nano-nemo-usvcs-retrain-20260530t153804z
  namespace: runai-rag
  labels:
    app.kubernetes.io/name: completion-collector
    app.kubernetes.io/component: nemotron-nano-30b
    app.kubernetes.io/part-of: docs-to-data-to-lora
    model-family: nemotron-nano
    adapter: lora-nemo-usvcs-retrain
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: completion-collector
        app.kubernetes.io/component: nemotron-nano-30b
        app.kubernetes.io/part-of: docs-to-data-to-lora
        model-family: nemotron-nano
        adapter: lora-nemo-usvcs-retrain
    spec:
      restartPolicy: Never
      containers:
        - name: completion-collector
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              pip install --no-cache-dir -q httpx
              python /scripts/collect_completions.py \
                --dataset <DATASET_ROOT>/nim_curated/test_set_with_context.jsonl \
                --dataset-slug nim_curated \
                --model lora-nemo-usvcs-nemotron-nano-30b-r16-retrain-20260530 \
                --run-id "$RUN_ID" \
                --max-tokens 8192 \
                --temperature 0.01 \
                --max-attempts 4 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 60 \
                --concurrency 2
              python /scripts/collect_completions.py \
                --dataset <DATASET_ROOT>/nemo_usvcs_curated/test_set_with_context.jsonl \
                --dataset-slug nemo_usvcs_curated \
                --model lora-nemo-usvcs-nemotron-nano-30b-r16-retrain-20260530 \
                --run-id "$RUN_ID" \
                --max-tokens 8192 \
                --temperature 0.01 \
                --max-attempts 4 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 60 \
                --concurrency 2
          env:
            - name: TARGET_API_URL
              value: "http://rag-oai-proxy.runai-rag:8080"
            - name: COMPLETIONS_OUTPUT_ROOT
              value: <EVAL_ROOT>/completions
            - name: RUN_ID
              value: "20260530T153804Z"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: collector-script
              mountPath: /scripts
              readOnly: true
            - name: nvme2
              mountPath: /workspace/artifacts
      volumes:
        - name: collector-script
          configMap:
            name: completion-collector-script
            defaultMode: 0555
        - name: nvme2
          persistentVolumeClaim:
            claimName: nvme2-pvc
