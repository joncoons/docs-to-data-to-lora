---
apiVersion: batch/v1
kind: Job
metadata:
  name: claude-sonnet-3b-e5-phase3-dd5x-r16-20260608t150134z
  namespace: runai-rag
  labels:
    app.kubernetes.io/name: direct-claude-sonnet-eval
    app.kubernetes.io/component: llama-3.2-3b-fiveepoch-phase3-missing
    app.kubernetes.io/part-of: docs-to-data-to-lora
    eval-run-id: "3b-fiveepoch-claude-sonnet-20260608t150134z"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: direct-claude-sonnet-eval
        app.kubernetes.io/component: llama-3.2-3b-fiveepoch-phase3-missing
        app.kubernetes.io/part-of: docs-to-data-to-lora
        eval-run-id: "3b-fiveepoch-claude-sonnet-20260608t150134z"
    spec:
      serviceAccountName: three-b-fiveepoch-eval-gate
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: direct-eval
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              python -m pip install --no-cache-dir -q --target /tmp/pydeps httpx
              export PYTHONPATH="/tmp/pydeps:${PYTHONPATH:-}"
              python - <<PYCODE
              import json
              import os
              import ssl
              import sys
              import time
              import urllib.request

              namespace = "runai-rag"
              upstream = "claude-sonnet-3b-fiveepoch-comparison-20260608t150134z"
              host = os.environ["KUBERNETES_SERVICE_HOST"]
              port = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
              token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
              ca_path = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              with open(token_path, "r", encoding="utf-8") as handle:
                  token = handle.read().strip()
              context = ssl.create_default_context(cafile=ca_path)
              url = f"https://{host}:{port}/apis/batch/v1/namespaces/{namespace}/jobs/{upstream}"
              headers = {"Authorization": f"Bearer {token}"}
              print(f"Waiting for upstream job {upstream} to complete", flush=True)
              while True:
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, context=context, timeout=30) as response:
                      job = json.load(response)
                  status = job.get("status", {})
                  conditions = status.get("conditions", []) or []
                  if any(item.get("type") == "Complete" and item.get("status") == "True" for item in conditions):
                      print(f"Upstream job {upstream} is complete; starting missing Phase 3 pair", flush=True)
                      break
                  if any(item.get("type") == "Failed" and item.get("status") == "True" for item in conditions):
                      raise SystemExit(f"Upstream job {upstream} failed; not running missing Phase 3 pair")
                  print(
                      f"Upstream status active={status.get('active', 0)} succeeded={status.get('succeeded', 0)} failed={status.get('failed', 0)}",
                      flush=True,
                  )
                  time.sleep(60)
              PYCODE

              export NIM_DD5X_E5_R16=/mnt/nvme2/peft/evals/completions/nim_curated/llama-3.2-3b/lora-nim-dd5x-e5/r16/20260608t061659z/responses.jsonl
              export NIM_49B=/mnt/nvme2/peft/evals/completions/nim_curated/llama-3.3-nemotron-super-49b-v1.5/base/base/20260529t142723z-plus-retry/responses.jsonl
              python - <<PYCODE
              import json
              import os
              from pathlib import Path
              for item in [os.environ["NIM_DD5X_E5_R16"], os.environ["NIM_49B"]]:
                  path = Path(item)
                  if not path.exists():
                      raise SystemExit(f"Missing responses file: {path}")
                  summary = path.parent / "token_summary.json"
                  if summary.exists():
                      payload = json.loads(summary.read_text(encoding="utf-8"))
                      if int(payload.get("rows_failed") or 0):
                          raise SystemExit(f"Completion file has unresolved failures: {summary}")
              print("Required completion files are present", flush=True)
              PYCODE
              echo "Starting missing Phase 3 Claude Sonnet pair: 49b vs 3b-nim-dd5x-e5-r16"
              python /scripts/pairwise/run_direct_kimi_pairwise.py \
                --pair 49b "$NIM_49B" 3b-nim-dd5x-e5-r16 "$NIM_DD5X_E5_R16" \
                --eval-run-id "3b-fiveepoch-claude-sonnet-pairwise-20260608t150134z" \
                --output-root "$PAIRWISE_OUTPUT_ROOT" \
                --judge-api-url "$JUDGE_API_URL" \
                --judge-model "$EVALUATOR_JUDGE_MODEL" \
                --judge-api-key-env KIMI_KEY \
                --judge-max-tokens 8192 \
                --judge-timeout-s 600 \
                --judge-max-attempts 5 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 120 \
                --retry-jitter-s 2 \
                --concurrency 4 \
                --resume \
                --position-swap \
                --log-every 25
          env:
            - name: PAIRWISE_OUTPUT_ROOT
              value: /mnt/nvme2/peft/evals/pairwise-claude-sonnet
            - name: JUDGE_API_URL
              value: https://inference-api.nvidia.com/v1/chat/completions
            - name: EVALUATOR_JUDGE_MODEL
              value: azure/anthropic/claude-sonnet-4-6
            - name: KIMI_KEY
              valueFrom:
                secretKeyRef:
                  name: kimi-judge-api
                  key: KIMI_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: pairwise-script
              mountPath: /scripts/pairwise
              readOnly: true
            - name: nvme2
              mountPath: /mnt/nvme2
      volumes:
        - name: pairwise-script
          configMap:
            name: direct-kimi-pairwise-script
            defaultMode: 0555
        - name: nvme2
          persistentVolumeClaim:
            claimName: nvme2-pvc
