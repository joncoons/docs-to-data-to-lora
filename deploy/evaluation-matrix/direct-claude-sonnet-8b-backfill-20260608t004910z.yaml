apiVersion: batch/v1
kind: Job
metadata:
  name: claude-sonnet-8b-backfill-20260608t004910z
  namespace: runai-rag
  labels:
    app.kubernetes.io/name: direct-claude-sonnet-backfill
    app.kubernetes.io/component: 8b-claude-phase1-phase2-phase3
    app.kubernetes.io/part-of: docs-to-data-to-lora
    eval-run-id: "claude-sonnet-8b-backfill-20260608t004910z"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: direct-claude-sonnet-backfill
        app.kubernetes.io/component: 8b-claude-phase1-phase2-phase3
        app.kubernetes.io/part-of: docs-to-data-to-lora
        eval-run-id: "claude-sonnet-8b-backfill-20260608t004910z"
    spec:
      restartPolicy: Never
      containers:
        - name: backfill
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              pip install --no-cache-dir -q httpx
              echo "Starting Phase 1 Claude Sonnet augmented 8B single-axis"
              python /scripts/singleaxis/run_direct_kimi_singleaxis.py \
                --responses <EVAL_ROOT>/completions/nim_curated/llama-3.1-8b/base/base/20260606t035159z/responses.jsonl \
                --responses <EVAL_ROOT>/completions/nim_curated/llama-3.1-8b/lora-nim-dd5x/r16/20260606t035159z/responses.jsonl \
                --responses <EVAL_ROOT>/completions/nim_curated/llama-3.1-8b/lora-nim-dd5x/r32/20260606t035159z/responses.jsonl \
                --responses <EVAL_ROOT>/completions/nemo_usvcs_curated/llama-3.1-8b/base/base/20260606t035159z/responses.jsonl \
                --responses <EVAL_ROOT>/completions/nemo_usvcs_curated/llama-3.1-8b/lora-nemo-usvcs-dd5x/r16/20260606t035159z/responses.jsonl \
                --responses <EVAL_ROOT>/completions/nemo_usvcs_curated/llama-3.1-8b/lora-nemo-usvcs-dd5x/r32/20260606t035159z/responses.jsonl \
                --eval-run-id "8b-dd5x-claude-sonnet-singleaxis-20260608t004910z" \
                --output-root "$SINGLEAXIS_OUTPUT_ROOT" \
                --judge-api-url "$JUDGE_API_URL" \
                --judge-model "$EVALUATOR_JUDGE_MODEL" \
                --judge-api-key-env KIMI_KEY \
                --judge-max-tokens 8192 \
                --judge-max-attempts 5 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 120 \
                --retry-jitter-s 2 \
                --concurrency 4 \
                --resume \
                --log-every 25

              echo "Starting Phase 2 Claude Sonnet 8B pairwise backfill"
              python /scripts/pairwise/run_direct_kimi_pairwise.py \
                --pair 8b-base <EVAL_ROOT>/completions/nim_curated/llama-3.1-8b/base/base/20260530t000400z/responses.jsonl 8b-nim-r16 <EVAL_ROOT>/completions/nim_curated/llama-3.1-8b/lora-nim/r16/20260530t000400z/responses.jsonl \
                --pair 8b-base <EVAL_ROOT>/completions/nim_curated/llama-3.1-8b/base/base/20260530t000400z/responses.jsonl 8b-nim-r32 <EVAL_ROOT>/completions/nim_curated/llama-3.1-8b/lora-nim/r32/20260530t000400z/responses.jsonl \
                --pair 8b-base <EVAL_ROOT>/completions/nim_curated/llama-3.1-8b/base/base/20260606t035159z/responses.jsonl 8b-nim-dd5x-r16 <EVAL_ROOT>/completions/nim_curated/llama-3.1-8b/lora-nim-dd5x/r16/20260606t035159z/responses.jsonl \
                --pair 8b-base <EVAL_ROOT>/completions/nim_curated/llama-3.1-8b/base/base/20260606t035159z/responses.jsonl 8b-nim-dd5x-r32 <EVAL_ROOT>/completions/nim_curated/llama-3.1-8b/lora-nim-dd5x/r32/20260606t035159z/responses.jsonl \
                --pair 8b-nim-dd5x-r16 <EVAL_ROOT>/completions/nim_curated/llama-3.1-8b/lora-nim-dd5x/r16/20260606t035159z/responses.jsonl 8b-nim-dd5x-r32 <EVAL_ROOT>/completions/nim_curated/llama-3.1-8b/lora-nim-dd5x/r32/20260606t035159z/responses.jsonl \
                --pair 8b-base <EVAL_ROOT>/completions/nemo_usvcs_curated/llama-3.1-8b/base/base/20260530t000400z/responses.jsonl 8b-nemo-usvcs-r16 <EVAL_ROOT>/completions/nemo_usvcs_curated/llama-3.1-8b/lora-nemo-usvcs/r16/20260530t000400z/responses.jsonl \
                --pair 8b-base <EVAL_ROOT>/completions/nemo_usvcs_curated/llama-3.1-8b/base/base/20260530t000400z/responses.jsonl 8b-nemo-usvcs-r32 <EVAL_ROOT>/completions/nemo_usvcs_curated/llama-3.1-8b/lora-nemo-usvcs/r32/20260530t000400z/responses.jsonl \
                --pair 8b-base <EVAL_ROOT>/completions/nemo_usvcs_curated/llama-3.1-8b/base/base/20260606t035159z/responses.jsonl 8b-nemo-usvcs-dd5x-r16 <EVAL_ROOT>/completions/nemo_usvcs_curated/llama-3.1-8b/lora-nemo-usvcs-dd5x/r16/20260606t035159z/responses.jsonl \
                --pair 8b-base <EVAL_ROOT>/completions/nemo_usvcs_curated/llama-3.1-8b/base/base/20260606t035159z/responses.jsonl 8b-nemo-usvcs-dd5x-r32 <EVAL_ROOT>/completions/nemo_usvcs_curated/llama-3.1-8b/lora-nemo-usvcs-dd5x/r32/20260606t035159z/responses.jsonl \
                --pair 8b-nemo-usvcs-dd5x-r16 <EVAL_ROOT>/completions/nemo_usvcs_curated/llama-3.1-8b/lora-nemo-usvcs-dd5x/r16/20260606t035159z/responses.jsonl 8b-nemo-usvcs-dd5x-r32 <EVAL_ROOT>/completions/nemo_usvcs_curated/llama-3.1-8b/lora-nemo-usvcs-dd5x/r32/20260606t035159z/responses.jsonl \
                --eval-run-id "8b-claude-sonnet-phase2-backfill-20260608t004910z" \
                --output-root "$PAIRWISE_OUTPUT_ROOT" \
                --judge-api-url "$JUDGE_API_URL" \
                --judge-model "$EVALUATOR_JUDGE_MODEL" \
                --judge-api-key-env KIMI_KEY \
                --judge-max-tokens 8192 \
                --judge-max-attempts 5 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 120 \
                --retry-jitter-s 2 \
                --concurrency 4 \
                --resume \
                --position-swap \
                --log-every 25

              echo "Starting Phase 3 Claude Sonnet 49B vs 8B pairwise backfill"
              python /scripts/pairwise/run_direct_kimi_pairwise.py \
                --pair 49b-base <EVAL_ROOT>/completions/nim_curated/llama-3.3-nemotron-super-49b-v1.5/base/base/20260529t142723z-plus-retry/responses.jsonl 8b-base <EVAL_ROOT>/completions/nim_curated/llama-3.1-8b/base/base/20260530t000400z/responses.jsonl \
                --pair 49b-base <EVAL_ROOT>/completions/nim_curated/llama-3.3-nemotron-super-49b-v1.5/base/base/20260529t142723z-plus-retry/responses.jsonl 8b-base-dd5x-run <EVAL_ROOT>/completions/nim_curated/llama-3.1-8b/base/base/20260606t035159z/responses.jsonl \
                --pair 49b-base <EVAL_ROOT>/completions/nim_curated/llama-3.3-nemotron-super-49b-v1.5/base/base/20260529t142723z-plus-retry/responses.jsonl 8b-nim-dd5x-r16 <EVAL_ROOT>/completions/nim_curated/llama-3.1-8b/lora-nim-dd5x/r16/20260606t035159z/responses.jsonl \
                --pair 49b-base <EVAL_ROOT>/completions/nim_curated/llama-3.3-nemotron-super-49b-v1.5/base/base/20260529t142723z-plus-retry/responses.jsonl 8b-nim-dd5x-r32 <EVAL_ROOT>/completions/nim_curated/llama-3.1-8b/lora-nim-dd5x/r32/20260606t035159z/responses.jsonl \
                --pair 49b-base <EVAL_ROOT>/completions/nemo_usvcs_curated/llama-3.3-nemotron-super-49b-v1.5/base/base/20260529t220127z/responses.jsonl 8b-base <EVAL_ROOT>/completions/nemo_usvcs_curated/llama-3.1-8b/base/base/20260530t000400z/responses.jsonl \
                --pair 49b-base <EVAL_ROOT>/completions/nemo_usvcs_curated/llama-3.3-nemotron-super-49b-v1.5/base/base/20260529t220127z/responses.jsonl 8b-base-dd5x-run <EVAL_ROOT>/completions/nemo_usvcs_curated/llama-3.1-8b/base/base/20260606t035159z/responses.jsonl \
                --pair 49b-base <EVAL_ROOT>/completions/nemo_usvcs_curated/llama-3.3-nemotron-super-49b-v1.5/base/base/20260529t220127z/responses.jsonl 8b-nemo-usvcs-dd5x-r16 <EVAL_ROOT>/completions/nemo_usvcs_curated/llama-3.1-8b/lora-nemo-usvcs-dd5x/r16/20260606t035159z/responses.jsonl \
                --pair 49b-base <EVAL_ROOT>/completions/nemo_usvcs_curated/llama-3.3-nemotron-super-49b-v1.5/base/base/20260529t220127z/responses.jsonl 8b-nemo-usvcs-dd5x-r32 <EVAL_ROOT>/completions/nemo_usvcs_curated/llama-3.1-8b/lora-nemo-usvcs-dd5x/r32/20260606t035159z/responses.jsonl \
                --eval-run-id "phase3-49b-vs-8b-claude-sonnet-backfill-20260608t004910z" \
                --output-root "$PAIRWISE_OUTPUT_ROOT" \
                --judge-api-url "$JUDGE_API_URL" \
                --judge-model "$EVALUATOR_JUDGE_MODEL" \
                --judge-api-key-env KIMI_KEY \
                --judge-max-tokens 8192 \
                --judge-max-attempts 5 \
                --retry-backoff-s 5 \
                --retry-backoff-max-s 120 \
                --retry-jitter-s 2 \
                --concurrency 4 \
                --resume \
                --position-swap \
                --log-every 25
          env:
            - name: SINGLEAXIS_OUTPUT_ROOT
              value: <EVAL_ROOT>/singleaxis-claude-sonnet
            - name: PAIRWISE_OUTPUT_ROOT
              value: <EVAL_ROOT>/pairwise-claude-sonnet
            - name: JUDGE_API_URL
              value: https://llm.example.com/v1/chat/completions
            - name: EVALUATOR_JUDGE_MODEL
              value: azure/anthropic/claude-sonnet-4-6
            - name: KIMI_KEY
              valueFrom:
                secretKeyRef:
                  name: kimi-judge-api
                  key: KIMI_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: singleaxis-script
              mountPath: /scripts/singleaxis
              readOnly: true
            - name: pairwise-script
              mountPath: /scripts/pairwise
              readOnly: true
            - name: nvme2
              mountPath: /workspace/artifacts
      volumes:
        - name: singleaxis-script
          configMap:
            name: direct-kimi-singleaxis-script
            defaultMode: 0555
        - name: pairwise-script
          configMap:
            name: direct-kimi-pairwise-script
            defaultMode: 0555
        - name: nvme2
          persistentVolumeClaim:
            claimName: nvme2-pvc
