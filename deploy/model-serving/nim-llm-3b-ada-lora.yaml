apiVersion: apps.nvidia.com/v1alpha1
kind: NIMService
metadata:
  name: nim-llm-3b-ada-lora
  namespace: runai-rag
spec:
  annotations:
    run.ai/gpu-memory: 42000M
  authSecret: ngc-api
  env:
    - name: NIM_HTTP_API_PORT
      value: "8000"
    - name: NIM_TRITON_LOG_VERBOSE
      value: "1"
    - name: NIM_SERVED_MODEL_NAME
      value: meta/llama-3.2-3b-instruct
    - name: NIM_MODEL_PROFILE
      value: 255e33ddadcde3794b506a296f185fae0b716f5788e30b1c837d076ff267039e
    - name: NIM_PEFT_SOURCE
      value: /model-store/lora-adapters
  expose:
    ingress:
      spec: {}
    service:
      grpcPort: 8001
      name: http
      port: 8000
      type: ClusterIP
  image:
    pullPolicy: IfNotPresent
    pullSecrets:
      - ngc-secret
    repository: nvcr.io/nim/meta/llama-3.2-3b-instruct
    tag: 1.10.1
  livenessProbe: {}
  metrics:
    serviceMonitor: {}
  nodeSelector:
    kubernetes.io/hostname: ubuntu2
  readinessProbe: {}
  replicas: 1
  resources:
    limits:
      nvidia.com/gpu: "1"
    requests:
      nvidia.com/gpu: "1"
  scale:
    hpa:
      maxReplicas: 0
      minReplicas: 1
  startupProbe: {}
  storage:
    nimCache:
      name: nim-llm-3b-cache
    pvc: {}
    sharedMemorySizeLimit: 16Gi
