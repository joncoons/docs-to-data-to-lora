---
apiVersion: batch/v1
kind: Job
metadata:
  name: submit-stage3-dense-lora
  namespace: nemo-peft
  labels:
    app.kubernetes.io/name: customizer-training
    app.kubernetes.io/component: dense-lora
    app.kubernetes.io/part-of: docs-to-data-to-lora
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customizer-training
        app.kubernetes.io/component: dense-lora
        app.kubernetes.io/part-of: docs-to-data-to-lora
    spec:
      restartPolicy: Never
      containers:
        - name: dense-lora
          image: <registry>/docs-to-data-to-lora/customizer-training:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nemo-platform-service-plane
          env:
            - name: CUSTOMIZER_PAYLOAD_FORMAT
              value: platform
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
            - name: MLFLOW_EXPERIMENT_NAME
              value: docs-to-data-to-lora
            - name: MLFLOW_RUN_NAME
              value: lora-nim-llama-3.2-3b-r16
            - name: CUSTOMIZER_TIMEOUT_S
              value: "21600"
            - name: PIPELINE_RUN_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          args:
            - --collection
            - nim_curated
            - --base-model
            - meta/llama-3.2-3b-instruct
            - --rank
            - "16"
            - --payload-format
            - platform
            - --wait
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
