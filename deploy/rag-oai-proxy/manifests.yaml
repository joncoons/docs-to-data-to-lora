---
# rag-oai-proxy infrastructure manifests.
# The proxy script source-of-truth is deploy/rag-oai-proxy/proxy.py — it gets
# loaded into the runtime ConfigMap by deploy.sh (kept separate so kubectl
# diffs on this YAML stay clean as the script evolves).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-oai-proxy
  namespace: runai-rag
  labels:
    app: rag-oai-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-oai-proxy
  template:
    metadata:
      labels:
        app: rag-oai-proxy
    spec:
      # Co-locate with rag-server on ubuntu-local-dev (cluster-local hop).
      nodeSelector:
        kubernetes.io/hostname: ubuntu-local-dev
      containers:
        - name: proxy
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              pip install --no-cache-dir -q fastapi uvicorn httpx
              exec uvicorn proxy:app --host 0.0.0.0 --port 8080 --app-dir /scripts
          env:
            - name: RAG_SERVER_URL
              value: "http://rag-server.runai-rag:8081"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: rag-oai-proxy-script
---
apiVersion: v1
kind: Service
metadata:
  name: rag-oai-proxy
  namespace: runai-rag
  labels:
    app: rag-oai-proxy
spec:
  type: ClusterIP
  selector:
    app: rag-oai-proxy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
