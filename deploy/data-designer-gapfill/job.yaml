---
apiVersion: batch/v1
kind: Job
metadata:
  name: data-designer-gapfill-nim-curated
  namespace: nemo-peft
  labels:
    app.kubernetes.io/name: data-designer-gapfill
    app.kubernetes.io/part-of: docs-to-data-to-lora
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-designer-gapfill
        app.kubernetes.io/part-of: docs-to-data-to-lora
    spec:
      restartPolicy: Never
      containers:
        - name: data-designer-gapfill
          image: <registry>/docs-to-data-to-lora/data-designer-gapfill:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nemo-platform-service-plane
          env:
            - name: NEMO_MICROSERVICES_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: nemo-platform-service-plane
                  key: NMP_DATA_DESIGNER_URL
            - name: NEMO_MICROSERVICES_DATASTORE_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: nemo-platform-service-plane
                  key: NMP_DATASTORE_HF_ENDPOINT
            - name: DATA_DESIGNER_SEED_REPO_ID
              value: "default/nim-curated-gapfill-seeds"
            - name: DATA_DESIGNER_MODEL
              value: "nvidia/nemotron-3-super-120b-a12b"
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow:5000"
            - name: MLFLOW_EXPERIMENT_NAME
              value: "docs-to-data-to-lora"
            - name: PIPELINE_RUN_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          args:
            - --dataset-dir
            - /datasets/nim_curated
            - --collection
            - nim_curated
            - --mode
            - prepare
            - --observability-dir
            - /observability/data-designer-gapfill/nim_curated
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: dataset-artifacts
              mountPath: /datasets
            - name: observability-output
              mountPath: /observability
      volumes:
        - name: dataset-artifacts
          persistentVolumeClaim:
            claimName: stage3-datasets
        - name: observability-output
          persistentVolumeClaim:
            claimName: pipeline-observability
