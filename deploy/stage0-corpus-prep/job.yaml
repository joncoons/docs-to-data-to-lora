---
apiVersion: batch/v1
kind: Job
metadata:
  name: stage0-corpus-prep-nim-curated
  namespace: nemo-peft
  labels:
    app.kubernetes.io/name: stage0-corpus-prep
    app.kubernetes.io/part-of: docs-to-data-to-lora
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stage0-corpus-prep
        app.kubernetes.io/part-of: docs-to-data-to-lora
    spec:
      restartPolicy: Never
      containers:
        - name: stage0-corpus-prep
          image: <registry>/docs-to-data-to-lora/stage0-corpus-prep:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PIPELINE_ES_HOST
              value: "https://rag-eck-elasticsearch-es-http.runai-rag:9200"
            - name: PIPELINE_ES_USER
              value: "elastic"
            - name: PIPELINE_ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pipeline-elasticsearch
                  key: PIPELINE_ES_PASSWORD
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow:5000"
            - name: MLFLOW_EXPERIMENT_NAME
              value: "docs-to-data-to-lora"
            - name: PIPELINE_RUN_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          args:
            - --index
            - nim_curated
            - --output-dir
            - /datasets/nim_curated
            - --observability-dir
            - /observability/stage0-corpus-prep/nim_curated
            - --url-registry
            - /crawler-registry/nim_curated_url_registry.json
            - --min-passage-tokens
            - "60"
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 16Gi
          volumeMounts:
            - name: dataset-artifacts
              mountPath: /datasets
            - name: observability-output
              mountPath: /observability
            - name: crawler-registry
              mountPath: /crawler-registry
              readOnly: true
      volumes:
        - name: dataset-artifacts
          persistentVolumeClaim:
            claimName: stage3-datasets
        - name: observability-output
          persistentVolumeClaim:
            claimName: pipeline-observability
        - name: crawler-registry
          persistentVolumeClaim:
            claimName: crawler-registry
