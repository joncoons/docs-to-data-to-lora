---
apiVersion: batch/v1
kind: Job
metadata:
  name: verify-stage3-platform-models
  namespace: nemo-peft
  labels:
    app.kubernetes.io/name: platform-models
    app.kubernetes.io/part-of: docs-to-data-to-lora
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-models
        app.kubernetes.io/part-of: docs-to-data-to-lora
    spec:
      restartPolicy: Never
      containers:
        - name: platform-models
          image: <registry>/docs-to-data-to-lora/platform-models:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nemo-platform-service-plane
          env:
            - name: OBSERVABILITY_DIR
              value: /outputs/observability/platform-models
            - name: PIPELINE_RUN_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          args:
            - --verify
            - --out
            - /outputs/observability/platform-models/platform_model_entities_manifest.json
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: model-entity-output
              mountPath: /outputs
      volumes:
        - name: model-entity-output
          persistentVolumeClaim:
            claimName: pipeline-observability
