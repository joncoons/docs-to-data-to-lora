# Customizer template — Nemotron-3-Nano-30B-A3B single-GPU LoRA SFT
#
# Source: Customizer config ConfigMap (namespace: nemo-peft),
# under customizationConfigTemplates.templates, captured 2026-05-26 from the
# live cluster.
#
# Purpose: this is the custom Customizer template used for the MoE LoRA SFT
# methodology documented in
#   NEMOTRON_NANO_LORA_METHODOLOGY.md
# §2 ("Custom Customizer template — +96GB-singleGPU"). It diverges from the
# shipped DP=2 / EP=2 recipe (which deterministically deadlocks in the
# FSDP-MoE checkpoint-gather path per [[project_nano_v3_sft_failed]]) by
# running on a single Blackwell with no NCCL coordination. Two parallel
# single-GPU jobs (one per shard) train ~4.8× faster wall-clock than a
# single DP=2 job AND eliminate the entire FSDP cross-rank failure class.
#
# Verification: this template is the active config exposed by the Customizer
# REST API as `nvidia/nemotron-3-nano-30b-a3b@v1.0+96GB-singleGPU`
# (GET /v1/customization/configs).
#
# To restore this template on a cluster where it's missing, splice this YAML
# block into the Customizer config ConfigMap under
# customizationConfigTemplates.templates and restart the customizer pod.
# The existing `@v1.0+96GB` (DP=2/EP=2) template is left intact as a
# documented fallback for hardware where single-GPU memory isn't sufficient.

nvidia/nemotron-3-nano-30b-a3b@v1.0+96GB-singleGPU:
  max_seq_length: 2048
  name: nemotron-3-nano-30b-a3b@v1.0+96GB-singleGPU
  namespace: nvidia
  prompt_template: '{prompt} {completion}'
  target: nvidia/nemotron-3-nano-30b-a3b@1.0
  training_options:
  - finetuning_type: lora
    micro_batch_size: 1
    num_gpus: 1
    num_nodes: 1
    tensor_parallel_size: 1
    training_type: sft
